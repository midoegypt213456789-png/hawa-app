<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HAWA CO - موظف</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
  :root {
    --gold:#C9A84C;--gold-light:#E8C97A;--dark:#0A0A0A;--dark2:#111111;--dark3:#1A1A1A;
    --text:#F0EDE8;--text-dim:#8A8580;--border:#2A2A2A;--error:#E05555;--success:#4CAF7D;--blue:#4A90D9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;padding:16px 16px 50px;}
  .container{width:100%;max-width:480px;margin:0 auto;}
  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:380px;}
  .login-logo{text-align:center;margin-bottom:28px;}
  .login-logo .icon{width:70px;height:70px;border-radius:20px;margin:0 auto 12px;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 32px rgba(201,168,76,0.3);}
  .login-logo .title{font-size:22px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .login-logo .sub{font-size:12px;color:var(--text-dim);margin-top:4px;letter-spacing:1px;}
  .login-card{background:var(--dark2);border:1px solid var(--border);border-radius:20px;padding:24px;}
  .login-card h3{font-size:15px;font-weight:700;margin-bottom:18px;text-align:center;}
  .login-card h3 span{color:var(--gold);}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  .inp-wrap{position:relative;}
  .inp-wrap .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
  input{width:100%;background:var(--dark3);border:1.5px solid var(--border);border-radius:12px;padding:11px 38px 11px 12px;font-family:'Cairo',sans-serif;font-size:14px;color:var(--text);outline:none;transition:all 0.3s;direction:rtl;}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.1);}
  input::placeholder{color:var(--text-dim);}
  .btn-login{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;border:none;border-radius:14px;cursor:pointer;margin-top:6px;box-shadow:0 4px 20px rgba(201,168,76,0.3);}
  .btn-login:disabled{opacity:0.6;cursor:not-allowed;}
  .alert{padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:14px;display:none;align-items:center;gap:8px;}
  .alert.err{display:flex;background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.3);color:var(--error);}
  /* MAIN */
  .main-view{display:none;}
  .main-view.show{display:block;}
  .login-view.hide{display:none;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--dark2);border-radius:16px;border:1px solid var(--border);margin-bottom:14px;}
  .logo{font-size:16px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .emp-name{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .role-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(74,144,217,0.15);color:var(--blue);}
  .logout-btn{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-family:'Cairo',sans-serif;}
  .wh-tabs{display:grid;gap:8px;margin-bottom:14px;}
  .wh-tabs.three{grid-template-columns:1fr 1fr 1fr;}
  .wh-tabs.two{grid-template-columns:1fr 1fr;}
  .wh-tabs.one{grid-template-columns:1fr;}
  .wh-btn{padding:12px;border-radius:14px;border:2px solid var(--border);background:var(--dark2);color:var(--text-dim);font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.25s;}
  .wh-btn.active{border-color:var(--gold);background:rgba(201,168,76,0.1);color:var(--gold);}
  .date-bar{text-align:center;padding:10px;background:var(--dark2);border-radius:12px;border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:14px;}
  .date-bar span{color:var(--gold);}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .stat-card{background:var(--dark2);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;}
  .stat-num{font-size:24px;font-weight:900;}
  .stat-lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .stat-num.pending{color:var(--blue);}
  .stat-num.done{color:var(--success);}
  .stat-num.noshow{color:var(--error);}
  .slot-group{margin-bottom:16px;}
  .slot-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--dark3);border-radius:10px;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--gold);}
  .slot-count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(201,168,76,0.15);color:var(--gold);margin-right:auto;}
  .bk-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all 0.25s;}
  .bk-card.done{border-color:rgba(76,175,125,0.4);background:rgba(76,175,125,0.05);}
  .bk-card.noshow{border-color:rgba(224,85,85,0.4);background:rgba(224,85,85,0.05);opacity:0.7;}
  .bk-info{flex:1;}
  .bk-name{font-size:14px;font-weight:700;margin-bottom:3px;}
  .bk-meta{font-size:12px;color:var(--text-dim);}
  .bk-meta span{color:var(--gold);font-weight:600;}
  .bk-sub{font-size:12px;color:var(--text);margin-top:2px;}
  .bk-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .bk-status.pending{background:rgba(74,144,217,0.15);color:var(--blue);}
  .bk-status.done{background:rgba(76,175,125,0.15);color:var(--success);}
  .bk-status.noshow{background:rgba(224,85,85,0.15);color:var(--error);}
  .check-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--border);background:var(--dark3);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
  .check-btn:hover:not(:disabled){border-color:var(--success);background:rgba(76,175,125,0.1);}
  .check-btn.checked{border-color:var(--success);background:rgba(76,175,125,0.15);cursor:default;}
  .check-btn.noshowed{border-color:var(--error);background:rgba(224,85,85,0.1);cursor:default;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
  .empty-state .ei{font-size:48px;margin-bottom:12px;}
  .loading-state{text-align:center;padding:40px;color:var(--text-dim);font-size:14px;}
  .noshow-all-btn{width:100%;padding:12px;border-radius:14px;margin-top:4px;border:1.5px solid rgba(224,85,85,0.4);background:transparent;color:var(--error);font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .noshow-all-btn:hover{background:rgba(224,85,85,0.08);}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .dialog{background:var(--dark2);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center;}
  .d-icon{font-size:44px;margin-bottom:12px;}
  .d-title{font-size:16px;font-weight:700;margin-bottom:8px;}
  .d-msg{font-size:13px;color:var(--text-dim);margin-bottom:20px;line-height:1.6;white-space:pre-line;}
  .d-btns{display:flex;gap:10px;}
  .d-yes{flex:1;padding:12px;border-radius:12px;border:none;background:var(--success);color:white;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .d-yes.danger{background:var(--error);}
  .d-no{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:transparent;color:var(--text-dim);font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .spin{width:16px;height:16px;border:2px solid rgba(10,10,10,0.3);border-top-color:#000;border-radius:50%;animation:sp 0.7s linear infinite;display:inline-block;vertical-align:middle;margin-left:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  /* 📦 النواقص */
  .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .sh-sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .sh-sub button{flex:1;min-width:90px;padding:9px 6px;border-radius:12px;border:1.5px solid var(--border);background:var(--dark2);color:var(--text-dim);font-family:'Cairo',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer}
  .sh-sub button.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.1)}
  .sh-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .sh-card.late{border-color:rgba(224,85,85,0.6)}
  .sh-card.today{border-color:rgba(201,168,76,0.7)}
  .sh-line{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border)}
  .sh-btn{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-family:'Cairo',sans-serif;font-size:14px;font-weight:800;cursor:pointer}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:120;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
  .modal.show{display:flex}
  .modal-box{background:var(--dark2);border:1px solid var(--border);border-radius:18px;padding:16px;width:100%;max-width:460px;margin:auto 0}
  .ci-row{background:var(--dark3);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
  .ci-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;font-weight:700}
  .ci-qty{width:76px !important;padding:6px 8px !important;text-align:center;font-size:14px !important;font-weight:800}
  .ci-parts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .ci-part{border:1.5px solid rgba(76,175,125,0.5);background:rgba(76,175,125,0.08);border-radius:10px;padding:7px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;user-select:none}
  .ci-part.off{border-color:rgba(224,85,85,0.6);background:rgba(224,85,85,0.08)}
  .ci-miss{display:none;margin-top:6px;gap:6px;align-items:center;font-size:11.5px;color:var(--text-dim)}
  .ci-part.off + .ci-miss, .ci-miss.show{display:flex}
  .ci-sel{background:#1A1A1A;color:#F0EDE8;border:1px solid var(--border);border-radius:8px;padding:5px;font-family:inherit;font-size:12px;color-scheme:dark;flex:1;min-width:0}
  .ci-sum{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.35);border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.8;margin:8px 0}
  .m-inp{width:100%;background:var(--dark3);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);outline:none}
</style>
</head>
<body>

<div class="login-view" id="loginView">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <div class="icon">🚛</div>
        <div class="title">HAWA CO</div>
        <div class="sub">بوابة الموظفين</div>
      </div>
      <div class="login-card">
        <h3>تسجيل دخول <span>الموظف</span></h3>
        <div class="alert" id="loginAlert"></div>
        <div class="form-group">
          <label>اسم المستخدم</label>
          <div class="inp-wrap">
            <span class="ic">👤</span>
            <input type="text" id="empUser" placeholder="اسم المستخدم" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <div class="inp-wrap">
            <span class="ic">🔒</span>
            <input type="password" id="empPass" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
        </div>
        <button class="btn-login" id="loginBtn" onclick="doLogin()">دخول</button>
      </div>
    </div>
  </div>
</div>

<div class="main-view" id="mainView">
  <div class="container">
    <div class="header">
      <div>
        <div class="logo">🚛 HAWA CO</div>
        <div class="emp-name" id="empNameDisplay"></div>
        <div id="refreshIndicator" style="font-size:11px;color:var(--text-dim);margin-top:4px"></div>
      </div>
      <div class="header-right">
        <span class="role-badge" id="roleBadge"></span>
        <button class="logout-btn" onclick="goReport()" style="background:#C9A84C;color:#111;border-color:#C9A84C;margin-left:6px">📊 التقرير</button>
        <button class="logout-btn" onclick="doLogout()">خروج</button>
      </div>
    </div>
    <div class="mode-tabs" id="modeTabs" style="display:none">
      <button class="wh-btn active" id="modeBk" onclick="setMode('bk')">📋 الحجوزات والحضور</button>
      <button class="wh-btn" id="modeSh" onclick="setMode('sh')">📦 تسليم النواقص <span id="shDueBadge" style="display:none;background:var(--error);color:#fff;border-radius:10px;padding:0 7px;font-size:11px"></span></button>
    </div>
    <div id="bkMode">
    <div class="wh-tabs" id="whTabs"></div>
    <div class="date-bar" style="display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px">
      <span style="font-size:18px">📅</span>
      <input type="date" id="datePickerFrom" onchange="changeDate()" style="background:#1A1A1A;color:#F0EDE8;border:1px solid var(--gold);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;color-scheme:dark" title="من تاريخ">
      <span style="color:var(--gold);font-weight:700;font-size:14px">←</span>
      <input type="date" id="datePickerTo" onchange="changeDate()" style="background:#1A1A1A;color:#F0EDE8;border:1px solid var(--gold);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;color-scheme:dark" title="إلى تاريخ">
      <button onclick="resetToToday()" id="todayBtn" style="background:rgba(201,168,76,0.15);color:#E0B040;border:1px solid rgba(201,168,76,0.4);border-radius:6px;padding:4px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:none">🔄 اليوم</button>
      <div id="dateLabel" style="color:var(--gold);font-weight:700;width:100%;text-align:center;margin-top:4px"></div>
    </div>

    <div class="filter-bar" style="display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px 10px">
      <select id="filterVehicle" onchange="applyFilters()" style="background:#1A1A1A;color:#F0EDE8;border:1px solid rgba(201,168,76,0.4);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer;color-scheme:dark;min-width:140px">
        <option value="">🚛 كل الأنواع</option>
      </select>
      <select id="filterSlot" onchange="applyFilters()" style="background:#1A1A1A;color:#F0EDE8;border:1px solid rgba(201,168,76,0.4);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer;color-scheme:dark;min-width:140px">
        <option value="">⏰ كل المواعيد</option>
      </select>
      <button onclick="resetFilters()" id="filterResetBtn" style="background:rgba(138,133,128,0.15);color:#A8A39E;border:1px solid rgba(138,133,128,0.4);border-radius:6px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:none">✖️ مسح</button>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-num pending" id="statPending">-</div><div class="stat-lbl">منتظر</div></div>
      <div class="stat-card"><div class="stat-num done"    id="statDone">-</div><div class="stat-lbl">حضر ✅</div></div>
      <div class="stat-card"><div class="stat-num noshow"  id="statNoshow">-</div><div class="stat-lbl">غائب ❌</div></div>
    </div>
    <div id="bookingsList"></div>
    <button class="noshow-all-btn" id="noshowAllBtn" onclick="showNoshowAllDlg()" style="display:none">❌ تسجيل الغائبين تلقائياً</button>
    </div>

    <!-- 📦 تسليم النواقص -->
    <div id="shMode" style="display:none">
      <div class="sh-sub">
        <button id="shTab-due" class="active" onclick="shTab('due')">⏰ مستحق / متأخر <span id="shCntDue"></span></button>
        <button id="shTab-upcoming" onclick="shTab('upcoming')">📅 جاى <span id="shCntUp"></span></button>
        <button id="shTab-done" onclick="shTab('done')">✅ اتسلّم</button>
      </div>
      <input id="shQ" class="m-inp" placeholder="🔍 اسم التاجر / الكود / رقم الإذن / رقم المستند" oninput="shRender()" style="margin-bottom:10px">
      <div id="shInfo" style="font-size:11.5px;color:var(--text-dim);margin-bottom:8px;text-align:center"></div>
      <div id="shList"><div class="loading-state">⏳ جاري التحميل...</div></div>
    </div>
  </div>
</div>

<!-- ✅ شاشة الحضور بالأصناف (شاسيه / ماتور) -->
<div class="modal" id="ciModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:15px;font-weight:800">✅ تسجيل حضور + استلام</div>
      <button class="logout-btn" onclick="ciClose()">✖</button>
    </div>
    <div id="ciHead" style="font-size:12.5px;color:var(--text-dim);line-height:1.8;margin-bottom:8px"></div>
    <div id="ciGuess" style="display:none;background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.4);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.7;margin-bottom:8px"></div>
    <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:8px;line-height:1.7">جنب كل صنف: اكتب اللى اتحمّل فعلاً، ولو الشاسيه أو الماتور متسلّمش كامل دوس عليه واكتب استلم كام.</div>
    <div id="ciRows"></div>
    <div class="ci-sum" id="ciSum"></div>
    <div style="display:flex;gap:8px">
      <button class="d-yes" id="ciSave" onclick="ciSave()">💾 حفظ الحضور</button>
      <button class="d-no" onclick="ciClose()">إلغاء</button>
    </div>
  </div>
</div>

<!-- 🤝 تسليم النواقص -->
<div class="modal" id="dlModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:15px;font-weight:800" id="dlTitle">🤝 تسليم نواقص</div>
      <button class="logout-btn" onclick="dlClose()">✖</button>
    </div>
    <div id="dlHead" style="font-size:12.5px;color:var(--text-dim);line-height:1.8;margin-bottom:8px"></div>
    <div id="dlRows"></div>
    <input id="dlReceiver" class="m-inp" placeholder="👤 اسم اللى استلم (لو مش التاجر نفسه)" style="margin:6px 0">
    <input id="dlNote" class="m-inp" placeholder="📝 ملاحظة (اختيارى)" style="margin-bottom:6px">
    <div class="ci-sum" id="dlSum"></div>
    <div style="display:flex;gap:8px">
      <button class="d-yes" id="dlSave" onclick="dlSave()">💾 حفظ التسليم</button>
      <button class="d-no" onclick="dlClose()">إلغاء</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="d-icon"  id="dlgIcon"></div>
    <div class="d-title" id="dlgTitle"></div>
    <div class="d-msg"   id="dlgMsg"></div>

// SLOTS بتتولد من ساعات عمل المخازن (من الداتابيز) + أي موعد موجود فعلاً في الحجوزات
// → أي تغيير في ساعات العمل ينعكس هنا تلقائياً، ومفيش حجز يختفي أبداً
let SLOTS = ['8:00 - 9:00','9:00 - 10:00','10:00 - 11:00','11:00 - 12:00','12:00 - 1:00','1:00 - 2:00','2:00 - 3:00','3:00 - 4:00']; // fallback مؤقت لحد ما الداتا توصل
let warehouseHoursByName = null;

// يحوّل "8:00 - 9:00" لساعة 24 للترتيب الصحيح (8-11 صباحاً، 12 ظهراً، 1-7 بعد الظهر)
function slotStartHour24(slot){
  const m = String(slot||'').match(/^(\d{1,2}):/);
  if(!m) return 99;
  const h = parseInt(m[1],10);
  if(h === 12) return 12;
  if(h >= 1 && h <= 7) return h + 12;
  return h;
}
function generateSlotsRange(ws, we){
  const fmt = h => h === 0 ? '12' : h > 12 ? String(h - 12) : String(h);
  const out = [];
  for(let h = ws; h < we; h++) out.push(`${fmt(h)}:00 - ${fmt(h+1)}:00`);
  return out;
}

// تحميل ساعات عمل المخازن (مرة واحدة، cached)
async function loadFilterMeta(){
  if(warehouseHoursByName) return;
  try{
    const whR = await fetch(`${SB}/rest/v1/warehouses?select=name,working_hour_start,working_hour_end,pending_working_hour_start,pending_working_hour_end`,{headers:HDR});
    const whs = await whR.json();
    warehouseHoursByName = {};
    (Array.isArray(whs)?whs:[]).forEach(w=>{
      const ws = Math.min(w.working_hour_start ?? 8,  w.pending_working_hour_start ?? (w.working_hour_start ?? 8));
      const we = Math.max(w.working_hour_end   ?? 16, w.pending_working_hour_end   ?? (w.working_hour_end   ?? 16));
      warehouseHoursByName[w.name] = {ws, we};
    });
  }catch(e){
    console.error('[filter-meta] load failed:', e);
    warehouseHoursByName = warehouseHoursByName || {};
  }
}

// إعادة بناء SLOTS حسب المخزن المختار + الحجوزات المحمّلة، وتحديث الفلاتر
function rebuildSlots(){
  const set = new Set();
  if(warehouseHoursByName && Object.keys(warehouseHoursByName).length){
    if(warehouse && warehouse !== 'ALL' && warehouseHoursByName[warehouse]){
      const {ws, we} = warehouseHoursByName[warehouse];
      generateSlotsRange(ws, we).forEach(s=>set.add(s));
    } else {
      Object.values(warehouseHoursByName).forEach(({ws, we})=>{
        generateSlotsRange(ws, we).forEach(s=>set.add(s));
      });
    }
  }
  if(!set.size) generateSlotsRange(8,16).forEach(s=>set.add(s));
  // 🛡️ ضمان: أي موعد موجود في الحجوزات الفعلية يظهر حتى لو خارج الساعات الحالية
  (allBookings||[]).forEach(b=>{ if(b.time_slot) set.add(b.time_slot); });
  SLOTS = [...set].sort((a,b)=>slotStartHour24(a)-slotStartHour24(b));
  rebuildFilterDropdowns();
}

}

function getDateStr(d){

async function loadWarehouseVehicleTypes(){
  if(vehicleTypesByWarehouse) return; // cached
  try {
    // 3 fetches منفصلة (أكثر reliability من الـ embed)
    const [whResp, vtResp, mapResp] = await Promise.all([
      fetch(`${SB}/rest/v1/warehouses?select=id,name`, { headers: HDR }),
      fetch(`${SB}/rest/v1/vehicle_types?select=id,name`, { headers: HDR }),
      fetch(`${SB}/rest/v1/warehouse_vehicle_types?is_active=eq.true&select=warehouse_id,vehicle_type_id,display_order&order=display_order.asc`, { headers: HDR })
    ]);
    const [warehouses, vehicleTypes, mappings] = await Promise.all([whResp.json(), vtResp.json(), mapResp.json()]);

    const whMap = {}; (warehouses || []).forEach(w => whMap[w.id] = w.name);
    const vtMap = {}; (vehicleTypes || []).forEach(v => vtMap[v.id] = v.name);

    vehicleTypesByWarehouse = {};
    for(const m of (mappings || [])){
      const whName = whMap[m.warehouse_id];
      const vtName = vtMap[m.vehicle_type_id];
      if(!whName || !vtName) continue;
      if(!vehicleTypesByWarehouse[whName]) vehicleTypesByWarehouse[whName] = [];
      if(!vehicleTypesByWarehouse[whName].includes(vtName)){
        vehicleTypesByWarehouse[whName].push(vtName);
      }
    }
    console.log('[vehicle-filter] loaded:', vehicleTypesByWarehouse);
  } catch(e){
    console.error('[vehicle-filter] load failed:', e);
    vehicleTypesByWarehouse = {}; // fallback — rebuildVehicleFilter بـ يستخدم default
  }
}

function rebuildVehicleFilter(){
  const sel = document.getElementById('filterVehicle');
  if(!sel) return;
  const currentValue = sel.value;

  let types = [];
  if(warehouse === 'ALL'){
    // Union: كل الأنواع المتاحة فى كل المخازن
    const set = new Set();
    if(vehicleTypesByWarehouse){
      Object.values(vehicleTypesByWarehouse).forEach(arr => arr.forEach(t => set.add(t)));
    }
    types = [...set];
  } else if(vehicleTypesByWarehouse && vehicleTypesByWarehouse[warehouse]){
    types = [...vehicleTypesByWarehouse[warehouse]];
  } else {
    // fallback: data لسه ما اتحملتش — اعرض الكل
    types = ['موتسيكل','تروسكل','كهرباء','ZONTOS'];
  }

  // ابنى الـ HTML
  let html = '<option value="">🚛 كل الأنواع</option>';
  for(const t of types){
    const icon = VEHICLE_ICONS[t] || '🚛';
    html += `<option value="${t}">${icon} ${t}</option>`;
  }
  sel.innerHTML = html;

  // استرجع الـ selection لو لسه available فى الـ list الجديدة
  if(currentValue && types.includes(currentValue)){
    sel.value = currentValue;
  } else if(currentValue){
    // الفلتر القديم مش متاح فى المخزن الجديد → reset
    filterVehicle = '';
    sel.value = '';
    if(allBookings.length) applyFilters();
  }
}

  document.getElementById('ciHead').innerHTML = `<b style="color:var(--text);font-size:14px">${escH(b.client_name||name)}</b> — كود ${escH(b.company_code||'-')}<br>` +
    `#${escH(b.seq_number||b.id)} · ${escH(b.warehouse)} · ${escH(b.vehicle_type)} · ${b.count} عربية${b.units?` (${b.units} قطعة)`:''}${b.permit_number?` · 🎫 ${escH(b.permit_number)}`:''}`;
  const g = document.getElementById('ciGuess');
  g.style.display = j.guess ? '' : 'none';
  g.innerHTML = '⚠️ التاجر محددش الأصناف وقت الحجز — الأعداد دى تقديرية من الإذن، <b>صحّح العدد اللى اتحمّل فعلاً لكل صنف</b> (وخلّى اللى متحمّلش صفر).';
  ciRender();
  document.getElementById('ciModal').classList.add('show');
}
function ciClose(){ document.getElementById('ciModal').classList.remove('show'); _ci = null; }
function ciReasonOpts(sel){ return '<option value="">السبب…</option>' + (_ci.reasons||[]).map(r => `<option ${r===sel?'selected':''}>${escH(r)}</option>`).join(''); }
function ciRender(){
  const box = document.getElementById('ciRows');
  box.innerHTML = _ci.rows.map((r, i) => {
    const chOff = r.ch !== null, moOff = r.mo !== null;
    return `<div class="ci-row">
      <div class="ci-top"><span style="overflow-wrap:anywhere">${escH(r.name)}</span>
        <span style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11.5px;color:var(--text-dim)">اتحمّل <input class="ci-qty" type="number" inputmode="numeric" min="0" value="${r.loaded}" oninput="ciQty(${i},this.value)"></span></div>
      <div class="ci-parts">
        <div>
          <div class="ci-part ${chOff?'off':''}" onclick="ciToggle(${i},'ch')">${chOff?'❌ شاسيه ناقص':'✅ شاسيه كامل'}</div>
          <div class="ci-miss ${chOff?'show':''}">استلم <input class="ci-qty" style="width:58px !important" type="number" min="0" value="${chOff?r.ch:''}" oninput="ciPart(${i},'ch',this.value)"> <select class="ci-sel" onchange="_ci.rows[${i}].chR=this.value">${ciReasonOpts(r.chR)}</select></div>
        </div>
        <div>
          <div class="ci-part ${moOff?'off':''}" onclick="ciToggle(${i},'mo')">${moOff?'❌ ماتور ناقص':'✅ ماتور كامل'}</div>
          <div class="ci-miss ${moOff?'show':''}">استلم <input class="ci-qty" style="width:58px !important" type="number" min="0" value="${moOff?r.mo:''}" oninput="ciPart(${i},'mo',this.value)"> <select class="ci-sel" onchange="_ci.rows[${i}].moR=this.value">${ciReasonOpts(r.moR)}</select></div>
        </div>
      </div>
    </div>`;
  }).join('');
  ciSum();
}
function ciQty(i, v){ const r = _ci.rows[i]; r.loaded = Math.max(0, parseInt(v||'0',10)||0); if (r.ch !== null) r.ch = Math.min(r.ch, r.loaded); if (r.mo !== null) r.mo = Math.min(r.mo, r.loaded); ciSum(); }
function ciToggle(i, k){ const r = _ci.rows[i]; r[k] = (r[k] === null) ? 0 : null; ciRender(); }
function ciPart(i, k, v){ const r = _ci.rows[i]; r[k] = Math.min(Math.max(0, parseInt(v||'0',10)||0), r.loaded); ciSum(); }
function ciSum(){
  let ld = 0, ch = 0, mo = 0;
  _ci.rows.forEach(r => { ld += r.loaded; if (r.ch !== null) ch += Math.max(r.loaded - r.ch, 0); if (r.mo !== null) mo += Math.max(r.loaded - r.mo, 0); });
  document.getElementById('ciSum').innerHTML = `📦 اتحمّل: <b>${ld}</b> قطعة` + ((ch+mo) ? `<br>📋 هيتعمل مستند نواقص: ${ch?`<b style="color:var(--error)">${ch} شاسيه</b>`:''}${ch&&mo?' + ':''}${mo?`<b style="color:var(--error)">${mo} ماتور</b>`:''}` : '<br>✅ مفيش نواقص — كله اتسلّم كامل');
}
async function ciSave(){
  const btn = document.getElementById('ciSave'); btn.disabled = true; btn.textContent = '⏳ بنحفظ...';
  const lines = _ci.rows.map(r => ({ item_idx: r.item_idx, name: r.name, loaded: r.loaded,
    chassis: r.ch === null ? r.loaded : r.ch, motor: r.mo === null ? r.loaded : r.mo, chassis_reason: r.chR || null, motor_reason: r.moR || null }));
  try{
    const j = await rpcEmp('shortage_checkin', { p_booking_id: _ci.id, p_lines: lines });
    if (!j || !j.ok) throw new Error((j && j.error) || 'فشل الحفظ');
    const b = allBookings.find(x => x.id === _ci.id); if (b) b.status = 'تم التنفيذ';
    renderBookings(); updateStats();
    document.getElementById('noshowAllBtn').style.display=getFilteredBookings().some(b=>b.status==='قيد الانتظار')?'block':'none';

  }catch(e){ alert('❌ ' + e.message); }

// ═══════════════ 🤝 تسليم النواقص ═══════════════
let _sh = { mode: 'due', docs: [], counts: {} }, _dl = null;
function shTab(m){ _sh.mode = m; ['due','upcoming','done'].forEach(k => document.getElementById('shTab-'+k).classList.toggle('active', k === m)); shLoad(); }
async function shCounts(){
  try{ const j = await rpcEmp('shortage_queue', { p_mode: 'due' }); shBadges(j && j.counts); }catch(_){}
}
function shBadges(c){
  c = c || {}; _sh.counts = c;
  const b = document.getElementById('shDueBadge'); if (b){ b.textContent = c.due || ''; b.style.display = c.due ? '' : 'none'; }
  const d = document.getElementById('shCntDue'); if (d) d.textContent = c.due ? `(${c.due})` : '';
  const u = document.getElementById('shCntUp'); if (u) u.textContent = c.upcoming ? `(${c.upcoming})` : '';
}
async function shLoad(){
  const list = document.getElementById('shList');
  if (!SESSION_TOKEN){ list.innerHTML = '<div class="empty-state"><div class="ei">🔐</div><p>اخرج وادخل تانى علشان تشوف النواقص</p></div>'; return; }
  list.innerHTML = '<div class="loading-state">⏳ جاري التحميل...</div>';
  try{
    const j = await rpcEmp('shortage_queue', { p_mode: _sh.mode });
    if (!j || !j.ok) throw new Error((j && j.error) || 'مشكلة');
    _sh.docs = j.docs || []; shBadges(j.counts);
    const a = j.actor || {};
    document.getElementById('shInfo').textContent = `👷 ${a.name||''} — ${a.wh==='عام'?'كل المخازن':'مخزن '+a.wh} — بتسلّم: ${(a.parts||[]).join(' + ')}`;
    shRender();
  }catch(e){ if(/الجلسة/.test(e.message)) needRelogin(e.message); list.innerHTML = '<div class="loading-state">❌ '+escH(e.message)+'</div>'; }
}
function shRender(){
  const q = (document.getElementById('shQ').value || '').trim();
  const today = new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
  const docs = _sh.docs.filter(d => !q || [d.client&&d.client.name, d.client&&d.client.code, d.permit_no, d.doc_no].some(v => String(v||'').includes(q)));
  const list = document.getElementById('shList');
  if (!docs.length){ list.innerHTML = `<div class="empty-state"><div class="ei">${_sh.mode==='done'?'📭':'✅'}</div><p>${_sh.mode==='due'?'مفيش نواقص مستحقة دلوقتى':_sh.mode==='upcoming'?'مفيش نواقص جاية':'مفيش تسليمات آخر 30 يوم'}</p></div>`; return; }
  list.innerHTML = docs.map(d => {
    const c = d.client || {}; const open = d.status === 'مفتوح';
    const late = open && d.due_date < today, isToday = open && d.due_date === today;
    const rem = (d.lines||[]).reduce((s,l)=>s+(+l.remaining||0),0);
    const st = !open ? `<span style="color:var(--success)">✅ ${escH(d.status)} — ${escH(d.closed_by_name||'')}${d.receiver_name?' · استلم: '+escH(d.receiver_name):''}</span>`
      : late ? `<span style="color:var(--error)">⚠️ متأخر ${d.days_late} يوم (كان ${dayAr(d.due_date)})</span>`
      : isToday ? `<span style="color:var(--gold-light)">📍 مستحق النهارده</span>` : `<span style="color:var(--gold)">📅 ميعاده ${dayAr(d.due_date)}</span>`;
    return `<div class="sh-card ${late?'late':isToday?'today':''}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <b style="font-size:14px">${d.part==='شاسيه'?'🔩':'⚙️'} ${escH(d.part)} — ${open?rem:''} ${open?'باقى':''}</b>
        <span style="font-size:11px;color:var(--text-dim)">${escH(d.doc_no)}${d.cycle>1?' · دورة '+d.cycle:''}</span>
      </div>
      <div style="font-size:13px;font-weight:700;margin-top:4px">${escH(c.name||'-')} <span style="color:var(--gold);font-size:12px">كود ${escH(c.code||'-')}</span></div>
      <div style="font-size:11.5px;color:var(--text-dim);line-height:1.8">${c.phone?`📞 <a href="tel:${escH(c.phone)}" style="color:var(--blue)">${escH(c.phone)}</a> · `:''}${escH(c.governorate||'')}${c.city?' / '+escH(c.city):''}<br>🎫 إذن ${escH(d.permit_no||'-')} · ${escH(d.warehouse)} · تحميل ${dayAr(d.loading_date)}${d.parent_no?' · مكمّل '+escH(d.parent_no):''}</div>
      <div style="font-size:12.5px;font-weight:800;margin:5px 0">${st}</div>
      ${(d.lines||[]).map(l => `<div class="sh-line"><span style="overflow-wrap:anywhere">${escH(l.name)}${l.reason?` <span style="color:var(--text-dim);font-size:11px">(${escH(l.reason)})</span>`:''}</span><b style="white-space:nowrap">${open?`${l.remaining} من ${l.qty}`:`${l.delivered}/${l.qty}`}</b></div>`).join('')}
      ${open ? `<button class="sh-btn" onclick="dlOpen(${d.id})">🤝 تسليم</button>` : ''}
    </div>`;
  }).join('');
}
function dlOpen(id){
  const d = _sh.docs.find(x => x.id === id); if (!d) return;
  const c = d.client || {};
  _dl = { d, rows: (d.lines||[]).filter(l => l.remaining > 0).map(l => ({ id: l.id, name: l.name, rem: l.remaining, full: true, qty: l.remaining })) };
  document.getElementById('dlTitle').textContent = `🤝 تسليم ${d.part} — ${d.doc_no}`;
  document.getElementById('dlHead').innerHTML = `<b style="color:var(--text);font-size:14px">${escH(c.name||'-')}</b> — كود ${escH(c.code||'-')}<br>🎫 إذن ${escH(d.permit_no||'-')} · ${escH(d.warehouse)} · ميعاده ${dayAr(d.due_date)}`;
  document.getElementById('dlReceiver').value = ''; document.getElementById('dlNote').value = '';
  dlRender();
  document.getElementById('dlModal').classList.add('show');
}
function dlClose(){ document.getElementById('dlModal').classList.remove('show'); _dl = null; }
function dlRender(){
  document.getElementById('dlRows').innerHTML = _dl.rows.map((r, i) => `<div class="ci-row">
    <div class="ci-top"><span style="overflow-wrap:anywhere">${escH(r.name)}</span><span style="font-size:12px;color:var(--text-dim);white-space:nowrap">باقى <b style="color:var(--gold-light)">${r.rem}</b></span></div>
    <div class="ci-parts">
      <div class="ci-part ${r.full?'':'off'}" onclick="dlToggle(${i})">${r.full?'✅ تسليم كامل':'✂️ تسليم جزئى'}</div>
      <div style="display:${r.full?'none':'flex'};align-items:center;gap:6px;font-size:12px;color:var(--text-dim)">اتسلّم <input class="ci-qty" type="number" min="0" max="${r.rem}" value="${r.qty}" oninput="dlQty(${i},this.value)"></div>
    </div></div>`).join('');
  dlSum();
}
function dlToggle(i){ const r = _dl.rows[i]; r.full = !r.full; r.qty = r.full ? r.rem : 0; dlRender(); }
function dlQty(i, v){ const r = _dl.rows[i]; r.qty = Math.min(Math.max(0, parseInt(v||'0',10)||0), r.rem); dlSum(); }
function dlSum(){
  const got = _dl.rows.reduce((s,r)=>s+(r.full?r.rem:r.qty),0), rem = _dl.rows.reduce((s,r)=>s+r.rem,0) - got;
  document.getElementById('dlSum').innerHTML = `🤝 هيتسلّم: <b>${got}</b> ${escH(_dl.d.part)}` + (rem > 0 ? `<br>📌 الباقى <b style="color:var(--error)">${rem}</b> — هيتعمل بيه مستند جديد بميعاد جديد` : '<br>✅ المستند هيتقفل بالكامل');
}
async function dlSave(){
  const lines = _dl.rows.map(r => ({ line_id: r.id, qty: r.full ? r.rem : r.qty })).filter(x => x.qty > 0);
  if (!lines.length){ alert('اكتب الكمية اللى اتسلّمت'); return; }
  const btn = document.getElementById('dlSave'); btn.disabled = true; btn.textContent = '⏳ بنحفظ...';
  try{
    const j = await rpcEmp('shortage_deliver', { p_doc_id: _dl.d.id, p_lines: lines, p_receiver: document.getElementById('dlReceiver').value || null, p_note: document.getElementById('dlNote').value || null });
    if (!j || !j.ok) throw new Error((j && j.error) || 'فشل الحفظ');
    dlClose();
    showInfo('✅','اتسجل التسليم', `اتسلّم ${j.delivered}` + (j.remaining > 0 ? `\nالباقى ${j.remaining} — مستند جديد ${j.new_doc_no} ميعاده ${dayAr(j.new_due)}` : '\nالمستند اتقفل بالكامل') + '\nوالتاجر هيوصله رسالة');
    shLoad();
  }catch(e){ alert('❌ ' + e.message); }
  btn.disabled = false; btn.textContent = '💾 حفظ التسليم';
}

function selectWarehouse(wh){
  warehouse=wh;
  document.querySelectorAll('.wh-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('wh-'+wh);
  if(btn)btn.classList.add('active');
  // 🚛 update vehicle filter حسب المخزن الجديد
  rebuildVehicleFilter();
  const whLabel = wh === 'ALL' ? 'كل المخازن' : wh;
  logActivity('emp_view_warehouse','🏭 فتح '+whLabel,{warehouse:wh});
  loadBookings();
}

async function loadBookings(){
  const list=document.getElementById('bookingsList');
  if(!allBookings.length) list.innerHTML='<div class="loading-state">⏳ جاري التحميل...</div>';
  document.getElementById('noshowAllBtn').style.display='none';
  try{
    const fromStr = getDateStr(selectedDateFrom);
    const toStr   = getDateStr(selectedDateTo);

    // ⚠️ Validation: from > to
    if(fromStr > toStr){
      list.innerHTML='<div class="empty-state"><div class="ei">⚠️</div><p>تاريخ البداية أحدث من تاريخ النهاية</p></div>';
      allBookings = []; updateStats();
      return;
    }

    let url=`${SB}/rest/v1/bookings?select=*&loading_date=gte.${fromStr}&loading_date=lte.${toStr}&status=neq.${encodeURIComponent('ملغي')}&order=loading_date.asc,time_slot.asc,id.asc`;
    if(warehouse !== 'ALL'){
      url += `&warehouse=eq.${encodeURIComponent(warehouse)}`;
    }
    const r=await fetch(url,{headers:HDR});
    allBookings=await r.json();
    if(!Array.isArray(allBookings)) allBookings=[];
    lastRefreshTime=Date.now();  // 📌 سجّل وقت آخر تحديث
    // ⏰ حدّث المواعيد والفلاتر ديناميكياً حسب المخزن والحجوزات
    await loadFilterMeta();
    rebuildSlots();
    if(!allBookings.length){
      const whLabel = warehouse === 'ALL' ? 'المخزنين' : warehouse;
      const isOnlyToday = (fromStr === getTodayStr() && toStr === getTodayStr());
      const dayLabel = isOnlyToday
        ? 'اليوم'
        : (fromStr === toStr
            ? selectedDateFrom.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'long'})
            : `الفترة دى`);
      list.innerHTML='<div class="empty-state"><div class="ei">📭</div><p>مفيش حجوزات '+dayLabel+' في '+whLabel+'</p></div>';
      updateStats();return;
    }
    const ids=[...new Set(allBookings.map(b=>b.client_id).filter(Boolean))];
    if(ids.length){
      const cr=await fetch(`${SB}/rest/v1/clients?id=in.(${ids.join(',')})&select=id,name,company_code`,{headers:HDR});
      const clients=await cr.json();
      const map={};clients.forEach(c=>map[c.id]=c);
      allBookings.forEach(b=>b._client=map[b.client_id]||{});
    }
    renderBookings();updateStats();
    document.getElementById('noshowAllBtn').style.display=getFilteredBookings().some(b=>b.status==='قيد الانتظار')?'block':'none';
  }catch(e){list.innerHTML='<div class="loading-state">❌ خطأ في التحميل</div>';}
}

function renderBookings(){
  const list=document.getElementById('bookingsList');
  const isAllMode = warehouse === 'ALL';
  const filtered = getFilteredBookings();

  // empty state لو فيه فلتر مفعّل و 0 results
  if(allBookings.length && !filtered.length){
    const hasFilter = filterVehicle || filterSlot;
    const reasons = [];
    if(filterVehicle) reasons.push(`النوع: ${filterVehicle}`);
    if(filterSlot)    reasons.push(`الموعد: ${filterSlot}`);
    list.innerHTML = `<div class="empty-state"><div class="ei">🔍</div><p>مفيش حجوزات بالفلاتر دى</p>${reasons.length?`<p style="font-size:12px;color:var(--text-dim);margin-top:6px">${reasons.join(' | ')}</p>`:''}</div>`;
    return;
  }

  let html='';
  SLOTS.forEach(slot=>{
    const slotBks=filtered.filter(b=>b.time_slot===slot);
    if(!slotBks.length)return;
    html+=`<div class="slot-group"><div class="slot-header">⏰ ${slot}<span class="slot-count">${slotBks.length} حجز</span></div>`;
    slotBks.forEach(b=>{
      const isDone=b.status==='تم التنفيذ',isNoshow=b.status==='no-show';
      const name=b._client?.name||'عميل #'+b.client_id;
      const code=b._client?.company_code||'-';
      // فى ALL mode، اعرض badge للمخزن
      const whBadge = isAllMode
        ? `<span style="background:${b.warehouse==='قليوب'?'rgba(74,144,217,0.15)':'rgba(180,140,40,0.15)'};border:1px solid ${b.warehouse==='قليوب'?'rgba(74,144,217,0.5)':'rgba(180,140,40,0.5)'};color:${b.warehouse==='قليوب'?'#4A90D9':'#E0B040'};padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:6px">${b.warehouse==='قليوب'?'🏭':'🏗️'} ${b.warehouse}</span>`
        : '';
      html+=`<div class="bk-card ${isDone?'done':isNoshow?'noshow':''}" id="card-${b.id}">
        <button class="check-btn ${isDone?'checked':isNoshow?'noshowed':''}"
          onclick="${isDone||isNoshow?'':`confirmDone(${b.id},'${name.replace(/'/g,"\'")}')`}"
          ${isDone||isNoshow?'disabled':''}>
          ${isDone?'✅':isNoshow?'❌':'○'}
        </button>
        <div class="bk-info">
          <div class="bk-name">${b.seq_number ? `<span style="background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);color:#E0B040;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px">#${b.seq_number}</span>` : ''}${b.permit_number ? `<span style="background:rgba(232,201,122,0.12);border:1px solid rgba(232,201,122,0.45);color:#E8C97A;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px;letter-spacing:0.3px">🎫 ${b.permit_number}</span>` : ''}${whBadge}${name}</div>
          <div class="bk-meta">كود: <span>${code}</span></div>
          <div class="bk-sub">🚗 ${b.vehicle_type} — ${b.count} عربية</div>
        </div>
        <div class="bk-status ${isDone?'done':isNoshow?'noshow':'pending'}">
          ${isDone?'حضر ✅':isNoshow?'غائب ❌':'منتظر'}
        </div>
      </div>`;
    });
    html+='</div>';
  });
  list.innerHTML=html;
}

function updateStats(){
  const filtered = getFilteredBookings();
  document.getElementById('statPending').textContent=filtered.filter(b=>b.status==='قيد الانتظار').length;
  document.getElementById('statDone').textContent=filtered.filter(b=>b.status==='تم التنفيذ').length;
  document.getElementById('statNoshow').textContent=filtered.filter(b=>b.status==='no-show').length;
}

function confirmDone(id,name){
  // 📦 لو نظام النواقص شغال: شاشة الأصناف (شاسيه/ماتور) — غير كده الحضور العادى
  ciOpen(id, name);
}

async function markStatus(id,status){
  try{
    const res=await fetch(`${SB}/rest/v1/bookings?id=eq.${id}`,{method:'PATCH',headers:{...HDR,'Prefer':'return=minimal'},body:JSON.stringify({status})});
    if(res.ok){
      const b=allBookings.find(x=>x.id===id);
      if(b){b.status=status;}
      if(status==='no-show'&&b?.client_id)await incrementNoshow(b.client_id);
      // 📜 سجّل الحركة
      if(b){
        const clientName = b._client?.name || 'عميل #'+b.client_id;
        if(status==='تم التنفيذ'){
          logActivity('emp_checkin','✅ سجل حضور: '+clientName,{booking_id:id,seq_number:b.seq_number,client_name:clientName,warehouse:b.warehouse,time_slot:b.time_slot});
        }else if(status==='no-show'){
          logActivity('emp_noshow','❌ سجل غياب: '+clientName,{booking_id:id,seq_number:b.seq_number,client_name:clientName,warehouse:b.warehouse,time_slot:b.time_slot});
        }
      }
      renderBookings();updateStats();
      document.getElementById('noshowAllBtn').style.display=getFilteredBookings().some(b=>b.status==='قيد الانتظار')?'block':'none';
    }
  }catch(e){}
}

async function incrementNoshow(clientId){
  try{
    // ─── 1) جلب الحدود الفعّالة و بيانات العميل بالتوازى ───
    const todayStr = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
    const [lr, cr] = await Promise.all([
      fetch(`${SB}/rest/v1/booking_limits?effective_from=lte.${todayStr}&order=effective_from.desc&limit=1&select=noshow_consecutive_max,noshow_period_max,noshow_period`, {headers:HDR}),
      fetch(`${SB}/rest/v1/clients?id=eq.${clientId}&select=no_show_count,last_unblocked_at`, {headers:HDR})
    ]);
    const limits = (await lr.json())[0];
    const cdata  = (await cr.json())[0] || {};
    const newCount = (cdata.no_show_count || 0) + 1;

    // ─── 2) لو الحدود مش موجودة، fallback لسلوك بسيط (no auto-block) ───
    if (!limits) {
      await fetch(`${SB}/rest/v1/clients?id=eq.${clientId}`, {
        method:'PATCH', headers:{...HDR,'Prefer':'return=minimal'},
        body: JSON.stringify({ no_show_count: newCount })
      });
      return;
    }

    // ─── 3) احسب rolling start (من آخر unblock أو من بداية الـ period — أيهما أحدث) ───
    const periodDays = { week: 7, month: 30, year: 365 }[limits.noshow_period] || 30;
    const periodStart = new Date(); periodStart.setDate(periodStart.getDate() - periodDays);
    const periodStartIso = periodStart.toISOString();
    const lastUnblock = cdata.last_unblocked_at;
    const effectiveStart = (lastUnblock && lastUnblock > periodStartIso) ? lastUnblock : periodStartIso;

    // ─── 4) اعمل الـ 2 queries بالتوازى ───
    //    A: عد كل الـ no-show فى الـ rolling period (بما فيهم الحالى)
    //    B: آخر N حجوزات finalized (تم التنفيذ أو no-show) للـ consecutive check
    const consecLimit = limits.noshow_consecutive_max;
    const [nsRes, recRes] = await Promise.all([
      fetch(`${SB}/rest/v1/bookings?client_id=eq.${clientId}&status=eq.no-show&created_at=gte.${encodeURIComponent(effectiveStart)}&select=id`, {headers:HDR}),
      fetch(`${SB}/rest/v1/bookings?client_id=eq.${clientId}&status=in.(${encodeURIComponent('تم التنفيذ')},no-show)&created_at=gte.${encodeURIComponent(lastUnblock || '2020-01-01')}&select=status,created_at&order=created_at.desc&limit=${consecLimit}`, {headers:HDR})
    ]);
    const noshowsInPeriod = (await nsRes.json()).length;  // الـ no-show الحالى متسجل بالفعل قبل ما الـ function تتنادى
    const recent = await recRes.json();
    const allRecentNoshow = recent.length >= consecLimit && recent.every(b => b.status === 'no-show');

    // ─── 5) اتخاذ القرار ───
    const shouldBlock = noshowsInPeriod >= limits.noshow_period_max || allRecentNoshow;

    await fetch(`${SB}/rest/v1/clients?id=eq.${clientId}`, {
      method:'PATCH', headers:{...HDR,'Prefer':'return=minimal'},
      body: JSON.stringify({ no_show_count: newCount, is_blocked: shouldBlock || false })
    });
  } catch(e) {
    console.error('incrementNoshow error:', e);
  }
}

function showNoshowAllDlg(){
  const pending=getFilteredBookings().filter(b=>b.status==='قيد الانتظار');
  const hasFilter = filterVehicle || filterSlot;
  const filterNote = hasFilter ? '\n(الفلاتر الحالية فقط)' : '';
  showDialog('❌','تسجيل الغائبين',`هتسجل ${pending.length} عميل كغائبين؟${filterNote}\nمش هتقدر ترجع!`,true,async()=>{
    logActivity('emp_noshow_bulk','❌ سجل غائبين تلقائياً ('+pending.length+' عميل)',{count:pending.length,date_from:getDateStr(selectedDateFrom),date_to:getDateStr(selectedDateTo),warehouse,filter_vehicle:filterVehicle||null,filter_slot:filterSlot||null});
    for(const b of pending)await markStatus(b.id,'no-show');
  });
}

function showDialog(icon,title,msg,danger,onYes){
  document.getElementById('dlgIcon').textContent=icon;
  document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgMsg').textContent=msg;
  const y=document.getElementById('dlgYes');
  y.className=danger?'d-yes danger':'d-yes';
  y.onclick=async()=>{hideDialog();await onYes();};
  document.getElementById('overlay').classList.add('show');
}
function hideDialog(){document.getElementById('overlay').classList.remove('show'); const n=document.querySelector('#overlay .d-no'); if(n) n.style.display=''; document.getElementById('dlgYes').textContent='تأكيد';}
function showInfo(icon,title,msg){ showDialog(icon,title,msg,false,async()=>{}); const n=document.querySelector('#overlay .d-no'); if(n) n.style.display='none'; document.getElementById('dlgYes').textContent='تمام 👍'; }

// 📌 متغيرات الـ auto-refresh + indicator
let lastRefreshTime=Date.now();
let refreshIndicatorTimer=null;

function startRefreshIndicator(){
  if(refreshIndicatorTimer)clearInterval(refreshIndicatorTimer);
  const el=document.getElementById('refreshIndicator');
  if(!el)return;
  refreshIndicatorTimer=setInterval(()=>{
    if(!emp){clearInterval(refreshIndicatorTimer);return;}
    const sec=Math.floor((Date.now()-lastRefreshTime)/1000);
    let txt;
    if(sec<5)      txt='✨ تم التحديث';
    else if(sec<60)  txt='🕐 آخر تحديث: '+sec+' ثانية';
    else             txt='🕐 آخر تحديث: '+Math.floor(sec/60)+' دقيقة';
    el.textContent=txt;
  },1000);
}
