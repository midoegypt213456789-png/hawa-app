<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HAWA مخزن">
<title>HAWA — المخزن</title>
<link rel="manifest" href="wh.webmanifest">
<link rel="apple-touch-icon" href="icons/hawa-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--dark:#0A0A0A;--dark2:#111111;--dark3:#1A1A1A;--text:#F0EDE8;--text-dim:#8A8580;--border:#2A2A2A;--error:#E05555;--success:#4CAF7D;--blue:#4A90D9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--dark);color:var(--text);font-family:'Cairo',sans-serif;min-height:100%}
body{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
.hd{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.hd .lg{font-weight:900;letter-spacing:2px;color:var(--gold)}.hd .nm{font-size:12px;color:var(--text-dim)}.hd .sp{flex:1}
.hd .net{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border)}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#111;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.btn.gh{background:var(--dark3);color:var(--text);border:1px solid var(--border)}.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn.red{background:none;border:1px solid var(--error);color:var(--error)}
.btn:disabled{opacity:.5}
.inp{width:100%;background:var(--dark3);border:1.5px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-size:16px;outline:none}
.inp:focus{border-color:var(--gold)}
.card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.dim{color:var(--text-dim);font-size:13px}.big{font-size:22px;font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--dark2);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--text-dim);padding:10px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button b{font-size:22px}.nav button.on{color:var(--gold)}
.scanbar{display:flex;gap:8px;margin-bottom:12px}
.scanbar .cam{flex:0 0 auto;font-size:22px;padding:8px 14px}
.whs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.wh{background:var(--dark3);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
.wh .n{font-size:12px;color:var(--text-dim)}.wh .q{font-size:20px;font-weight:900}
.msg{padding:10px 12px;border-radius:12px;margin-bottom:10px;font-weight:700;font-size:14px}
.msg.ok{background:rgba(76,175,125,.12);border:1px solid rgba(76,175,125,.5);color:#8fe0b5}.msg.er{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.5);color:#f2a0a0}
.ln{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #262626}.ln:last-child{border:0}
.ln .t{flex:1;min-width:0}.ln .t b{display:block}.ln .q{display:flex;align-items:center;gap:4px}
.ln .q input{width:62px;text-align:center;padding:6px;font-size:16px;font-weight:800}
.qb{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--dark3);color:var(--text);font-size:18px;font-weight:900}
.ln.hit{animation:hit .8s}@keyframes hit{0%{background:rgba(201,168,76,.35)}100%{background:transparent}}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text-dim)}
.chip.g{border-color:rgba(76,175,125,.6);color:#8fe0b5}.chip.r{border-color:rgba(224,85,85,.6);color:#f2a0a0}.chip.y{border-color:rgba(201,168,76,.6);color:var(--gold-light)}
.bar{height:8px;background:#222;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light))}
#cam{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover}
#cam .ov{position:absolute;left:10%;right:10%;top:30%;height:26%;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#cam .ft{position:absolute;bottom:0;left:0;right:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
#cam .last{flex:1;color:#fff;font-weight:800;font-size:15px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:100%;max-width:380px}
.login .lg{text-align:center;font-size:28px;font-weight:900;letter-spacing:4px;color:var(--gold);margin-bottom:4px}
.lab{display:block;font-size:12px;color:var(--text-dim);margin:10px 0 4px;font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<div id="vLogin" class="login hide"><div class="box">
  <div class="lg">HAWA CO</div><div class="dim" style="text-align:center;margin-bottom:18px">📱 تطبيق المخزن — جرد واستعلام بالباركود</div>
  <div class="card">
    <label class="lab">اسم المستخدم</label><input id="lu" class="inp" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lp').focus()">
    <label class="lab">كلمة المرور</label><input id="lp" type="password" class="inp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lmsg"></div>
    <button class="btn" id="lbtn" style="width:100%;margin-top:14px" onclick="doLogin()">دخول</button>
  </div></div></div>

<div id="vApp" class="hide">
  <div class="hd"><span class="lg">HAWA</span><span class="nm" id="uName"></span><span class="sp"></span><span class="net" id="net">🟢</span><button class="btn gh sm" onclick="logout()">خروج</button></div>
  <div class="wrap" id="main"></div>
  <div class="nav">
    <button id="nb-item" onclick="tab('item')"><b>🔎</b>صنف</button>
    <button id="nb-cnt" onclick="tab('cnt')"><b>🧮</b>جرد</button>
    <button id="nb-eng" onclick="tab('eng')"><b>🏍️</b>ماتور / شاسيه</button>
  </div>
</div>

<div id="cam"><video id="camv" playsinline muted></video><div class="ov"></div>
  <div class="ft"><div class="last" id="camLast">وجّه الكاميرا على الباركود</div><button class="btn sm" id="camT" onclick="camTorch()">🔦</button><button class="btn gh sm" onclick="camStop()">✖ قفل</button></div></div>

<script>
const SB='https://oqsowwtjutpjdypjpcum.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xc293d3RqdXRwamR5cGpwY3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MzI5ODAsImV4cCI6MjA5MTAwODk4MH0.Dp-WXuV-fHBsv35xiO7LnkTDevxKE5CC2iEVGNmwnqQ';
const HDR={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let U=null, BOOT=null, S={tab:'item', item:{q:'',res:null,err:''}, cnt:{list:null,cur:null,blind:true,dirty:{},err:'',ok:'',filter:''}, eng:{q:'',res:null,err:''}};
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:3});
const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} }};
function normQ(s){ return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim(); }
async function rpc(fn,args,anon){ const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:HDR,body:JSON.stringify(anon?args:{p_token:U&&U.token,...args})});
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(!r.ok){ const m=(j&&(j.message||j.error))||t||('HTTP '+r.status); if(/جلسة غير صالحة|session/i.test(m)&&!anon){ logout(true); } throw new Error(m); } return j; }
function errTxt(e){ const m=String(e&&e.message||e||''); if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return '📶 مفيش نت — هنحاول تانى'; if(/صلاحية|permission/i.test(m)) return '⛔ معندكش صلاحية للشاشة دى — كلم الأدمن'; return m.replace(/^.*?ERROR:\s*/,''); }
// ═══ الدخول ═══
// 🔐 التحقق بخطوتين — كود على التليجرام لما تدخل من جهاز جديد (الجهاز بيتفتكر 30 يوم)
function secDev(){ try{ let d=localStorage.getItem('hawa_dev'); if(!d||d.length<16){ d=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join(''); localStorage.setItem('hawa_dev',d); } return d; }catch(e){ return ''; } }
function secOtpAsk(x){ return new Promise(resolve=>{ const o=document.createElement('div'); o.id='sec-otp';
  o.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Cairo,sans-serif';
  const B='flex:1;border:0;border-radius:12px;padding:11px;font:800 15px Cairo,sans-serif;cursor:pointer';
  o.innerHTML=`<div dir="rtl" style="background:#111;border:1px solid #C9A84C;border-radius:16px;padding:20px;width:100%;max-width:360px;color:#F0EDE8;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.6)">
    <div style="font-size:32px">🔐</div><div style="font-weight:800;font-size:17px;margin:4px 0">كود الدخول</div>
    <div style="font-size:13px;color:#8A8580">بعتنالك كود من 6 أرقام على التليجرام ${x.tg?'('+String(x.tg).replace(/[<>&]/g,'')+')':''}</div>
    <input id="sec-otp-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" style="width:100%;margin-top:14px;background:#1A1A1A;border:1.5px solid #2A2A2A;border-radius:12px;padding:12px;color:#fff;font:800 24px monospace;letter-spacing:8px;text-align:center;outline:none">
    <label style="display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;color:#8A8580;cursor:pointer"><input type="checkbox" id="sec-otp-tr" checked style="width:auto;margin:0;flex:0 0 auto"> افتكر الجهاز ده 30 يوم</label>
    <div id="sec-otp-msg" style="color:#E05555;font-size:13px;min-height:18px;margin-top:8px"></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button id="sec-otp-ok" style="${B};background:linear-gradient(135deg,#C9A84C,#E8C97A);color:#111">دخول</button><button id="sec-otp-x" style="${B};background:#1A1A1A;color:#F0EDE8;border:1px solid #2A2A2A;flex:0 0 90px">إلغاء</button></div></div>`;
  document.body.appendChild(o); const inp=o.querySelector('#sec-otp-in'), msg=o.querySelector('#sec-otp-msg'), ok=o.querySelector('#sec-otp-ok'); setTimeout(()=>inp.focus(),50);
  let busy=false; const go=async()=>{ if(busy) return; const c=inp.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,''); if(c.length!==6){ msg.textContent='اكتب الـ 6 أرقام'; return; }
    busy=true; ok.disabled=true; ok.textContent='⏳'; msg.textContent='';
    try{ const r=await fetch(`${SB}/rest/v1/rpc/login_otp_verify`,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','x-hawa-device':secDev()},body:JSON.stringify({p_otp:x.otp,p_code:c,p_trust:o.querySelector('#sec-otp-tr').checked})});
      const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!r.ok||!j||j.error||!j.token){ msg.textContent=(j&&(j.error||j.message))||'الكود غلط'; inp.value=''; if(/خلص|ادخل تانى/.test(msg.textContent)){ setTimeout(()=>{ o.remove(); resolve(null); },1600); } return; }
      o.remove(); resolve(j); }
    catch(e){ msg.textContent='📶 مفيش نت — حاول تانى'; } finally{ busy=false; ok.disabled=false; ok.textContent='دخول'; } };
  ok.onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); inp.addEventListener('input',()=>{ if(inp.value.replace(/\D/g,'').length===6) go(); });
  o.querySelector('#sec-otp-x').onclick=()=>{ o.remove(); resolve(null); }; }); }

async function tryLogin(fn,u,p){ try{ const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{...HDR,'x-hawa-device':secDev()},body:JSON.stringify({p_username:u,p_password:p})}); const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){} if(r.ok&&j&&j.need_otp){ j=await secOtpAsk(j); if(!j) throw new Error('اتلغى الدخول — لازم كود التليجرام'); } if(r.ok&&j&&j.token) return j; if(j&&j.message&&/محاولات|موقوف/.test(j.message)) throw new Error(j.message); }catch(e){ if(/محاولات|موقوف/.test(e.message)) throw e; } return null; }
async function doLogin(){ const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value, b=document.getElementById('lbtn'), m=document.getElementById('lmsg'); m.innerHTML='';
  if(!u||!p){ m.innerHTML='<div class="msg er" style="margin-top:10px">اكتب اسم المستخدم وكلمة المرور</div>'; return; }
  b.disabled=true; b.textContent='⏳ جارى التحقق...';
  try{ let x=await tryLogin('login_admin_secure',u,p); if(!x) x=await tryLogin('login_employee_secure',u,p); if(!x) throw new Error('اسم المستخدم أو كلمة المرور غلط');
    U={token:x.token,name:x.name||x.full_name||x.username||u}; LS.set('hawa_wh',U); await enter(); }
  catch(e){ m.innerHTML=`<div class="msg er" style="margin-top:10px">${E(errTxt(e))}</div>`; } finally{ b.disabled=false; b.textContent='دخول'; } }
function logout(expired){ LS.del('hawa_wh'); U=null; BOOT=null; document.getElementById('vApp').classList.add('hide'); document.getElementById('vLogin').classList.remove('hide'); if(expired) document.getElementById('lmsg').innerHTML='<div class="msg er" style="margin-top:10px">الجلسة خلصت — سجّل الدخول تانى</div>'; }
async function enter(){ document.getElementById('vLogin').classList.add('hide'); document.getElementById('vApp').classList.remove('hide'); document.getElementById('uName').textContent=U.name||'';
  try{ BOOT=await rpc('erp_bootstrap',{}); LS.set('hawa_wh_boot',{t:Date.now(),items:BOOT.items,warehouses:BOOT.warehouses}); }catch(e){ const c=LS.get('hawa_wh_boot',null); if(c) BOOT=c; if(!U) return; }
  tab(LS.get('hawa_wh_tab','item')); syncPending(); }
function itemsMap(){ const m={}; ((BOOT&&BOOT.items)||[]).forEach(i=>m[i.id]=i); return m; }
function whName(id){ const w=((BOOT&&BOOT.warehouses)||[]).find(x=>String(x.id)===String(id)); return w?w.name:'—'; }
function findItemLocal(code){ const q=normQ(code).toUpperCase(); const L=(BOOT&&BOOT.items)||[]; return L.find(i=>String(i.barcode||'').toUpperCase()===q)||L.find(i=>String(i.code||'').toUpperCase()===q)||null; }
function tab(t){ S.tab=t; LS.set('hawa_wh_tab',t); ['item','cnt','eng'].forEach(x=>document.getElementById('nb-'+x).classList.toggle('on',x===t)); render(); if(t==='cnt'&&!S.cnt.list) cntLoad(); setTimeout(()=>{ const i=document.getElementById('sq'); if(i&&!('ontouchstart' in window)) i.focus(); },50); }
function scanBar(ph,fn,val){ return `<div class="scanbar"><input id="sq" class="inp" dir="ltr" autocomplete="off" autocapitalize="characters" placeholder="${E(ph)}" value="${E(val||'')}" onkeydown="if(event.key==='Enter'){event.preventDefault();${fn}(this.value)}"><button class="btn cam" onclick="camStart(${fn})" title="امسح بالكاميرا">📷</button></div>`; }
function render(){ const el=document.getElementById('main'); if(!el) return; el.innerHTML=S.tab==='item'?itemHtml():S.tab==='cnt'?cntHtml():engHtml(); }
// ═══ 🔎 استعلام صنف ═══
async function itemFind(q){ q=normQ(q); S.item.q=q; if(!q) return; S.item.err=''; S.item.res=null; render();
  try{ S.item.res=await rpc('erp_wh_item',{p_q:q}); }catch(e){ S.item.err=errTxt(e); } render(); beep(S.item.res&&S.item.res.length?1:0); }
function itemHtml(){ const I=S.item; let h=scanBar('امسح الباركود أو اكتب الكود / الاسم','itemFind',I.q);
  if(I.err) h+=`<div class="msg er">${E(I.err)}</div>`;
  if(I.res===null&&I.q&&!I.err) h+='<div class="dim">⏳ بندوّر...</div>';
  if(I.res&&!I.res.length) h+=`<div class="msg er">❓ مفيش صنف بـ «${E(I.q)}»</div>`;
  (I.res||[]).forEach(x=>{ const tot=(x.wh||[]).reduce((a,w)=>a+Number(w.actual||0),0), low=x.reorder!=null&&Number(x.free)<Number(x.reorder);
    h+=`<div class="card"><div class="row" style="align-items:flex-start">${x.img?`<img src="${E(x.img)}" style="width:72px;height:72px;object-fit:contain;background:#000;border-radius:10px">`:'<div style="width:56px;height:56px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:center;font-size:28px">📦</div>'}
      <div style="flex:1;min-width:0"><div class="big" dir="ltr" style="text-align:right">${E(x.code)}</div><div>${E(x.name)}</div><div class="dim">${E(x.cat||'')}${x.barcode?` · <span dir="ltr">${E(x.barcode)}</span>`:''}</div></div></div>
      <div class="row" style="margin-top:10px;gap:12px;flex-wrap:wrap"><span>فعلى فى المخازن: <b>${N(tot)}</b></span><span>متاح للبيع: <b style="color:${Number(x.free)>0?'var(--success)':'var(--error)'}">${N(x.free)}</b></span>${low?'<span class="chip r">⚠️ تحت حد الطلب</span>':''}</div>
      <div class="whs">${(x.wh||[]).map(w=>`<div class="wh"><div class="n">🏬 ${E(w.wh)}</div><div class="q">${N(w.actual)}</div><div class="dim">دفترى ${N(w.book)}</div></div>`).join('')||'<div class="dim">مفيش رصيد فى أى مخزن</div>'}</div></div>`; });
  if(!I.q) h+='<div class="card dim">📷 دوس على الكاميرا وامسح باركود الصنف — أو استخدم سكانر البلوتوث/USB (بيكتب فى الخانة ويدوس Enter لوحده).</div>';
  return h; }
// ═══ 🧮 الجرد ═══
async function cntLoad(){ S.cnt.err=''; try{ const L=await rpc('erp_count_list',{}); S.cnt.list=L.filter(c=>c.status==='مسودة'); if(S.cnt.cur){ const c=L.find(x=>x.id===S.cnt.cur.id); if(c&&c.status==='مسودة'){ S.cnt.cur=c; cntApplyPending(); } else S.cnt.cur=null; } }catch(e){ S.cnt.err=errTxt(e); } render(); }
function cntOpen(id){ S.cnt.cur=(S.cnt.list||[]).find(c=>c.id===id)||null; S.cnt.ok=''; S.cnt.err=''; S.cnt.filter=''; cntApplyPending(); render(); }
function cntApplyPending(){ const c=S.cnt.cur; if(!c) return; const P=LS.get('hawa_wh_pend',{})[c.id]||{}; Object.entries(P).forEach(([iid,v])=>{ let l=c.lines.find(x=>String(x.item_id)===iid); if(!l){ l={item_id:Number(iid),book:null,sys:null,counted:null,added:true}; c.lines.push(l); } l.counted=v; }); }
function cntSetPending(iid,v){ const c=S.cnt.cur; const P=LS.get('hawa_wh_pend',{}); P[c.id]=P[c.id]||{}; P[c.id][iid]=v; LS.set('hawa_wh_pend',P); clearTimeout(S.cnt.__t); S.cnt.__t=setTimeout(syncPending,1200); }
async function syncPending(){ const P=LS.get('hawa_wh_pend',{}); const ids=Object.keys(P); if(!ids.length||!U) { netBadge(); return; }
  for(const cid of ids){ const lines=Object.entries(P[cid]).map(([iid,v])=>({item_id:Number(iid),counted:v})); if(!lines.length){ delete P[cid]; continue; }
    try{ await rpc('erp_count_save',{p:{id:Number(cid),lines}}); const P2=LS.get('hawa_wh_pend',{}); if(P2[cid]){ lines.forEach(l=>{ if(P2[cid][l.item_id]===l.counted) delete P2[cid][l.item_id]; }); if(!Object.keys(P2[cid]).length) delete P2[cid]; LS.set('hawa_wh_pend',P2); } }
    catch(e){ const m=errTxt(e); if(!/مفيش نت/.test(m)){ S.cnt.err='⚠️ ماتحفظش: '+m; if(/مينفعش يتعدل|مش موجود/.test(m)){ const P2=LS.get('hawa_wh_pend',{}); delete P2[cid]; LS.set('hawa_wh_pend',P2); } render(); } } }
  netBadge(); }
function pendN(){ const P=LS.get('hawa_wh_pend',{}); return Object.values(P).reduce((a,o)=>a+Object.keys(o).length,0); }
function netBadge(){ const n=document.getElementById('net'); if(!n) return; const p=pendN(); n.textContent=!navigator.onLine?`🔴 أوفلاين${p?' · '+p+' مستنى':''}`:(p?`🟡 بنحفظ ${p}`:'🟢 متحفظ'); }
function cntScan(code){ const c=S.cnt.cur; if(!c) return; code=normQ(code); if(!code) return; const it=findItemLocal(code); const i=document.getElementById('sq'); if(i) i.value='';
  if(!it){ S.cnt.err=`❓ «${code}» مش صنف معروف`; S.cnt.ok=''; beep(0); render(); return false; }
  let l=c.lines.find(x=>Number(x.item_id)===Number(it.id)); if(!l){ l={item_id:it.id,book:null,sys:null,counted:null,added:true}; c.lines.unshift(l); }
  l.counted=(Number(l.counted)||0)+1; cntSetPending(it.id,l.counted); S.cnt.err=''; S.cnt.ok=`✅ ${it.code} — ${it.name_ar||''} = ${N(l.counted)}${l.added?' (مش فى القايمة — اتضاف)':''}`; S.cnt.hit=it.id; beep(1); render(); return `${it.code} = ${N(l.counted)}`; }
function cntQty(iid,d,set){ const l=S.cnt.cur.lines.find(x=>Number(x.item_id)===iid); if(!l) return; let v=set!==undefined?(set===''?null:Math.max(0,Number(set)||0)):Math.max(0,(Number(l.counted)||0)+d); l.counted=v; cntSetPending(iid,v); S.cnt.hit=iid; if(set===undefined) render(); }
async function cntNew(){ const w=document.getElementById('cnw'); if(!w||!w.value){ S.cnt.err='اختار المخزن'; render(); return; } try{ const id=await rpc('erp_count_new',{p:{warehouse_id:Number(w.value)}}); await cntLoad(); cntOpen(id); }catch(e){ S.cnt.err=errTxt(e); render(); } }
function cntHtml(){ const C=S.cnt, M=itemsMap(); let h='';
  if(C.err) h+=`<div class="msg er">${E(C.err)}</div>`;
  if(!C.cur){ if(C.list===null) return h+'<div class="dim">⏳ جارى التحميل...</div>';
    h+=C.list.map(c=>{ const done=c.lines.filter(l=>l.counted!=null).length; return `<div class="card" onclick="cntOpen(${c.id})" style="cursor:pointer"><div class="row"><b style="font-size:17px">🧮 جرد ${E(c.no)}</b>${c.test?' 🧪':''}<span class="sp" style="flex:1"></span><span class="chip y">مسودة</span></div>
      <div class="dim">🏬 ${E(whName(c.warehouse_id))} · ${E(c.date)} · ${E(c.by||'')}</div><div class="dim">اتعد ${done} من ${c.lines.length} صنف</div><div class="bar"><i style="width:${c.lines.length?Math.round(done/c.lines.length*100):0}%"></i></div></div>`; }).join('')||'<div class="card dim">مفيش جرد مفتوح دلوقتى</div>';
    h+=`<div class="card"><b>➕ جرد جديد</b><div class="row" style="margin-top:8px"><select id="cnw" class="inp"><option value="">اختار المخزن</option>${((BOOT&&BOOT.warehouses)||[]).filter(w=>w.is_active!==false).map(w=>`<option value="${w.id}">${E(w.name)}</option>`).join('')}</select><button class="btn" onclick="cntNew()">ابدأ</button></div><div class="dim" style="margin-top:6px">💡 الاعتماد وتسوية الفروق بتتعمل من البرنامج (المخازن ← الجرد الفعلى).</div></div>
      <button class="btn gh" style="width:100%" onclick="S.cnt.list=null;render();cntLoad()">🔄 تحديث</button>`;
    return h; }
  const c=C.cur, done=c.lines.filter(l=>l.counted!=null).length, f=normQ(C.filter).toUpperCase();
  h+=`<div class="row" style="margin-bottom:10px"><button class="btn gh sm" onclick="S.cnt.cur=null;cntLoad()">→ رجوع</button><b>🧮 جرد ${E(c.no)} — ${E(whName(c.warehouse_id))}</b></div>`;
  h+=scanBar('امسح الصنف — كل مسحة = قطعة','cntScan','');
  if(C.ok) h+=`<div class="msg ok">${E(C.ok)}</div>`;
  h+=`<div class="card" style="padding:10px 12px"><div class="row"><span>اتعد <b>${done}</b> من ${c.lines.length} صنف</span><span style="flex:1"></span><label class="dim" style="display:flex;gap:4px;align-items:center"><input type="checkbox" ${C.blind?'checked':''} onchange="S.cnt.blind=this.checked;render()"> جرد أعمى</label></div><div class="bar"><i style="width:${c.lines.length?Math.round(done/c.lines.length*100):0}%"></i></div></div>`;
  h+=`<input class="inp" style="margin-bottom:8px;font-size:14px;padding:8px 12px" placeholder="🔎 فلتر فى القايمة" value="${E(C.filter)}" oninput="S.cnt.filter=this.value;render();const i=document.querySelector('[data-flt]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}" data-flt="1">`;
  const ls=c.lines.filter(l=>{ if(!f) return true; const it=M[l.item_id]||{}; return (String(it.code||'')+' '+String(it.name_ar||'')).toUpperCase().includes(f); });
  h+=`<div class="card" style="padding:4px 12px">${ls.map(l=>{ const it=M[l.item_id]||{code:'#'+l.item_id,name_ar:''}; const cn=l.counted, diff=cn!=null&&l.sys!=null?Number(cn)-Number(l.sys):null;
    return `<div class="ln${S.cnt.hit===Number(l.item_id)?' hit':''}"><div class="t"><b dir="ltr" style="text-align:right">${E(it.code)}</b><span class="dim">${E(it.name_ar||'')}</span>${C.blind?'':`<div class="dim">على السيستم ${N(l.sys)}${diff!=null?` · <span class="chip ${diff===0?'g':'r'}">${diff>0?'+':''}${N(diff)}</span>`:''}</div>`}${l.added?'<span class="chip y">اتضاف</span>':''}</div>
      <div class="q"><button class="qb" onclick="cntQty(${l.item_id},-1)">−</button><input class="inp" type="number" inputmode="numeric" value="${cn==null?'':E(cn)}" placeholder="—" onchange="cntQty(${l.item_id},0,this.value)"><button class="qb" onclick="cntQty(${l.item_id},1)">+</button></div></div>`; }).join('')||'<div class="dim" style="padding:10px">مفيش</div>'}</div>`;
  S.cnt.hit=null; return h; }
// ═══ 🏍️ ماتور / شاسيه ═══
async function engFind(q){ q=normQ(q); S.eng.q=q; if(!q) return; S.eng.err=''; S.eng.res=null; render(); try{ S.eng.res=await rpc('erp_wr_find',{p:{q}}); }catch(e){ S.eng.err=errTxt(e); } render(); beep(S.eng.res&&S.eng.res.length?1:0); }
function engHtml(){ const X=S.eng; let h=scanBar('امسح أو اكتب رقم الماتور / الشاسيه','engFind',X.q);
  if(X.err) h+=`<div class="msg er">${E(X.err)}</div>`; if(X.res===null&&X.q&&!X.err) h+='<div class="dim">⏳ بندوّر...</div>';
  if(X.res&&!X.res.length) h+=`<div class="msg er">❓ مفيش موتوسيكل بـ «${E(X.q)}»</div>`;
  (X.res||[]).forEach(r=>{ const act=r.w_end&&r.w_end>=new Date().toISOString().slice(0,10);
    h+=`<div class="card"><div class="big" style="font-size:17px">${E(r.item)}</div>
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px"><span class="chip">⚙️ <span dir="ltr">${E(r.engine||'—')}</span></span><span class="chip">🔩 <span dir="ltr">${E(r.chassis||'—')}</span></span>${r.w_end?`<span class="chip ${act?'g':'r'}">🛡️ ضمان ${act?'ساري':'خلص'} لحد ${E(r.w_end)}</span>`:''}</div>
      <div class="dim" style="margin-top:8px">🏪 ${E(r.client||'—')}${r.client_phone?` · <a href="tel:${E(r.client_phone)}" style="color:var(--gold)">${E(r.client_phone)}</a>`:''}</div>
      ${r.del_no?`<div class="dim">🚚 تسليم ${E(r.del_no)} · ${E(r.del_date||'')}</div>`:''}
      ${r.letter?`<div class="dim">✉️ جواب ${E(r.letter.no)} · ${E(r.letter.at||'')} — ${E(r.letter.buyer||'')} ${E(r.letter.gov||'')}</div>`:'<div class="dim">✉️ لسه مالوش جواب</div>'}
      ${r.claims?`<div class="dim">🔧 مطالبات ضمان: ${E(r.claims)}</div>`:''}</div>`; });
  return h; }
// ═══ 📷 الكاميرا (BarcodeDetector) ═══
let CAM={st:null,det:null,cb:null,run:false,last:'',lastT:0,torch:false};
async function camStart(cb){ CAM.cb=cb; const box=document.getElementById('cam');
  if(!('BarcodeDetector' in window)){ alert('الموبايل ده مش بيدعم قراية الباركود بالكاميرا من المتصفح.\nاستخدم Chrome على أندرويد، أو سكانر بلوتوث، أو اكتب الكود.'); return; }
  try{ const fm=await BarcodeDetector.getSupportedFormats(); CAM.det=new BarcodeDetector({formats:fm.length?fm:['code_128','ean_13','qr_code']});
    CAM.st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e){ alert('مقدرناش نفتح الكاميرا — اسمح للتطبيق يستخدم الكاميرا من إعدادات المتصفح'); return; }
  const v=document.getElementById('camv'); v.srcObject=CAM.st; await v.play().catch(()=>{}); box.style.display='flex'; CAM.run=true; document.getElementById('camLast').textContent='وجّه الكاميرا على الباركود'; camLoop(); }
async function camLoop(){ if(!CAM.run) return; const v=document.getElementById('camv');
  try{ if(v.readyState>=2){ const r=await CAM.det.detect(v); if(r&&r.length){ const code=r[0].rawValue, now=Date.now();
      if(code && (code!==CAM.last || now-CAM.lastT>1800)){ CAM.last=code; CAM.lastT=now; if(navigator.vibrate) navigator.vibrate(60);
        const res=CAM.cb(code); if(CAM.cb!==cntScan){ camStop(); return; } document.getElementById('camLast').textContent=(res?res:'❓ '+code); } } } }catch(e){}
  setTimeout(camLoop,180); }
function camStop(){ CAM.run=false; if(CAM.st) CAM.st.getTracks().forEach(t=>t.stop()); CAM.st=null; CAM.torch=false; document.getElementById('cam').style.display='none'; }
async function camTorch(){ try{ const t=CAM.st&&CAM.st.getVideoTracks()[0]; if(!t) return; CAM.torch=!CAM.torch; await t.applyConstraints({advanced:[{torch:CAM.torch}]}); }catch(e){} }
let AC=null; function beep(ok){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=ok?1250:300; g.gain.value=.08; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(ok?.09:.25)); }catch(e){} }
window.addEventListener('online',()=>{ netBadge(); syncPending(); }); window.addEventListener('offline',netBadge); setInterval(syncPending,15000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ syncPending(); if(CAM.run) camStop(); } });
(function(){ U=LS.get('hawa_wh',null); if(U&&U.token) enter(); else logout(); })();
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw-wh.js').catch(()=>{}));
