<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>أبو حوا — موتوسيكلات</title>
<meta name="description" content="اسأل عن أى موتوسيكل، شوف المواصفات والأسعار، واحنا نوصلك بأقرب تاجر معتمد فى منطقتك.">
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0B0D; --panel:#141417; --raise:#1C1C21; --line:#2A2A31;
  --gold:#C9A84C; --gold-lite:#E8C97A; --gold-dim:rgba(201,168,76,.14);
  --text:#F2EFE9; --dim:#8E8A83; --ok:#4CAF7D; --err:#E05555;
  --sent:#2A2415; --recv:#17171B;
  --shell:min(560px,100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink); color:var(--text);
  font-family:'Cairo',system-ui,sans-serif; font-size:15px; line-height:1.6;
  display:flex; justify-content:center; overflow:hidden;
}
.app{width:var(--shell);height:100dvh;display:flex;flex-direction:column;background:var(--panel);position:relative;overflow:hidden}
@media(min-width:600px){.app{border-inline:1px solid var(--line)}}

/* ── الهيدر ── */
.hd{display:flex;align-items:center;gap:11px;padding:12px 14px;flex-shrink:0;z-index:5;
  background:linear-gradient(180deg,#1E1E24,#17171B);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.ava{width:46px;height:46px;border-radius:16px;flex-shrink:0;position:relative;box-shadow:0 6px 18px rgba(201,168,76,.22);
  background:linear-gradient(140deg,var(--gold),var(--gold-lite));
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#111}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.ava::after{content:'';position:absolute;inset-inline-end:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
  background:var(--ok);border:2.5px solid #1B1B21;box-shadow:0 0 0 3px rgba(76,175,125,.18)}
.hd-t{flex:1;min-width:0}
.hd-name{font-weight:900;font-size:15.5px;letter-spacing:.2px;
  background:linear-gradient(120deg,var(--gold-lite),var(--gold));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.hd-sub{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
.icon-btn{background:transparent;border:none;color:var(--dim);font-size:19px;cursor:pointer;padding:7px;border-radius:10px;transition:.15s;font-family:inherit}
.icon-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}

/* ── مجرى الرسايل ── */
.feed{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px 8px;scroll-behavior:smooth;
  background-image:radial-gradient(circle at 20% 12%,rgba(201,168,76,.05),transparent 42%),
                   radial-gradient(circle at 82% 78%,rgba(201,168,76,.035),transparent 46%)}
.row{display:flex;margin-bottom:9px;animation:rise .26s cubic-bezier(.2,.8,.3,1) both}
.row.me{justify-content:flex-start}
.row.her{justify-content:flex-end}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.row{animation:none}}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14.5px;white-space:pre-wrap;
  word-break:break-word;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.03);line-height:1.75}
.me .bub{background:linear-gradient(160deg,#302818,#241E12);border:1px solid rgba(201,168,76,.3);border-end-start-radius:6px}
.her .bub{background:linear-gradient(160deg,#1B1B20,#16161A);border:1px solid var(--line);border-end-end-radius:6px}
.bub b{color:var(--gold-lite);font-weight:700}
.tm{font-size:10px;color:var(--dim);margin-top:3px;text-align:start;opacity:.75}

/* ── مؤشر الكتابة ── */
.typing{display:flex;gap:4px;padding:13px 15px;background:var(--recv);border:1px solid var(--line);border-radius:16px;border-end-end-radius:5px;width:fit-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.45;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ── ✨ كارت الموتوسيكل — العنصر المميز ── */
.card{max-width:88%;background:var(--recv);border:1px solid var(--line);border-radius:16px;border-end-end-radius:5px;overflow:hidden;margin-bottom:9px}
.card-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#0e0e11;display:block}
.card-imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:2px}
.card-imgs img{width:100%;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;background:#0e0e11}
.card-b{padding:12px 13px}
.card-nm{font-weight:900;font-size:16px;line-height:1.3}
.card-br{font-size:11.5px;color:var(--dim);margin-bottom:9px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.price-v{font-size:20px;font-weight:900;color:var(--gold-lite);letter-spacing:-.3px}
.price-l{font-size:11px;color:var(--dim)}
.price-note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{background:var(--gold-dim);border:1px solid rgba(201,168,76,.3);color:var(--gold-lite);
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip.n{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--dim)}
.card-cta{width:100%;background:linear-gradient(140deg,var(--gold),var(--gold-lite));border:none;color:#141005;
  font-family:inherit;font-weight:900;font-size:14px;padding:11px;border-radius:11px;cursor:pointer;transition:.15s}
.card-cta:active{transform:scale(.985)}

/* ── الملحن ── */
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--raise);border-top:1px solid var(--line);flex-shrink:0}
.inp{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:22px;color:var(--text);
  font-family:inherit;font-size:15px;padding:11px 16px;resize:none;max-height:110px;line-height:1.5;outline:none;transition:border-color .15s}
.inp:focus{border-color:rgba(201,168,76,.5)}
.mic{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:19px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.mic:hover{color:var(--gold);border-color:rgba(201,168,76,.45)}
.mic.rec{background:linear-gradient(140deg,#E05555,#F07070);color:#fff;border-color:transparent;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,85,85,.45)}50%{box-shadow:0 0 0 9px rgba(224,85,85,0)}}
.rec-bar{display:none;align-items:center;gap:9px;flex:1;background:var(--panel);border:1px solid rgba(224,85,85,.4);
  border-radius:22px;padding:11px 16px;font-size:14px;color:var(--text)}
.rec-bar.on{display:flex}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--err);animation:blink 1s infinite}
.voice-msg{display:flex;align-items:center;gap:9px;min-width:180px}
.voice-play{width:34px;height:34px;flex-shrink:0;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--gold),var(--gold-lite));color:#141005;font-size:14px}
.wave{flex:1;display:flex;align-items:center;gap:2.5px;height:22px}
.wave i{flex:1;background:rgba(201,168,76,.5);border-radius:2px;min-height:4px}
.clip{width:40px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--dim);cursor:pointer;border-radius:12px;transition:.15s;user-select:none}
.clip:hover{background:rgba(255,255,255,.05);color:var(--gold)}
.clip.busy{opacity:.45;pointer-events:none}
.send{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--gold),var(--gold-lite));color:#141005;font-size:19px;transition:.15s}
.send:disabled{opacity:.35;cursor:default}
.send:not(:disabled):active{transform:scale(.92)}

/* ── شريط التسجيل ── */
.nudge{margin:4px 4px 12px;background:linear-gradient(135deg,rgba(201,168,76,.14),rgba(201,168,76,.05));
  border:1px solid rgba(201,168,76,.34);border-radius:15px;padding:14px}
.nudge h4{margin:0 0 4px;font-size:14.5px;color:var(--gold-lite);font-weight:900}
.nudge p{margin:0 0 11px;font-size:12.5px;color:var(--dim);line-height:1.65}
.nudge-btns{display:flex;gap:8px}
.btn{flex:1;font-family:inherit;font-weight:800;font-size:13.5px;padding:10px;border-radius:11px;cursor:pointer;transition:.15s;border:1px solid transparent}
.btn-p{background:linear-gradient(140deg,var(--gold),var(--gold-lite));color:#141005}
.btn-g{background:transparent;border-color:var(--line);color:var(--text)}
.btn:active{transform:scale(.98)}

/* ── الشيت ── */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.22s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--raise);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.85,.3,1);z-index:21;max-height:92dvh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
.sheet h3{margin:0 0 5px;font-size:18px;font-weight:900}
.sheet .lead{margin:0 0 16px;font-size:12.5px;color:var(--dim);line-height:1.65}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--text)}
.fld input,.fld select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-family:inherit;font-size:15px;padding:11px 13px;outline:none;transition:border-color .15s}
.fld input:focus,.fld select:focus{border-color:rgba(201,168,76,.55)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.msg{font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:11px;display:none;line-height:1.6}
.msg.err{display:block;background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.35);color:#F4A0A0}
.msg.ok{display:block;background:rgba(76,175,125,.12);border:1px solid rgba(76,175,125,.35);color:#8FDCB4}
.swap{text-align:center;font-size:12.5px;color:var(--dim);margin-top:13px}
.swap b{color:var(--gold-lite);cursor:pointer;font-weight:800}

/* ── حسابى ── */
.me-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.me-row span{color:var(--dim)}
.me-row b{font-weight:700;text-align:end}

.feed::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:5px}
.feed::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.f-lbl{display:block;font-size:12.5px;color:var(--dim);margin:10px 0 5px}
</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
<div class="app">

  <header class="hd">
    <div class="ava" id="ava"><span id="avaIcon">🏍️</span></div>
    <div class="hd-t">
      <div class="hd-name" id="hdName">أبو حوا للموتوسيكلات</div>
      <div class="hd-sub" id="hdSub">اسأل عن أى موديل — الرد فورى</div>
    </div>
    <button class="icon-btn" id="meBtn" onclick="openMe()" title="حسابى" style="display:none">👤</button>
  </header>

  <main class="feed" id="feed"></main>

  <div class="composer">
    <label class="clip" id="clipBtn" title="ابعت صورة بطاقتك" style="display:none">📎
      <input type="file" id="idFile" accept="image/*" style="display:none" onchange="uploadId(this)">
    </label>
    <div class="rec-bar" id="recBar"><span class="rec-dot"></span><span id="recTime">0:00</span>
      <span style="color:var(--dim);font-size:12.5px">بتسجّل... اضغط ✓ للإرسال</span></div>
    <textarea class="inp" id="inp" rows="1" placeholder="اكتب سؤالك..." autocomplete="off"></textarea>
    <button class="mic" id="micBtn" onclick="toggleRec()" title="رسالة صوتية" style="display:none">🎤</button>
    <button class="send" id="sendBtn" onclick="send()" title="ابعت">➤</button>
  </div>

  <div class="veil" id="veil" onclick="closeSheet()"></div>

  <!-- تسجيل / دخول -->
  <div class="sheet" id="authSheet">
    <div class="grab"></div>
    <h3 id="authTitle">اعمل حسابك فى دقيقة</h3>
    <p class="lead" id="authLead">عشان نوصلك بأقرب تاجر معتمد فى منطقتك ونتابع معاك لحد ما تستلم.</p>
    <div class="msg" id="authMsg"></div>

    <div id="regFields">
      <div class="fld"><label for="rName">الاسم بالكامل</label><input id="rName" autocomplete="name" placeholder="محمد أحمد على"></div>
      <div class="fld"><label for="rPhone">رقم الموبايل</label><input id="rPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01xxxxxxxxx">
      <label class="f-lbl">الرقم القومى <span style="color:var(--err)">*</span></label>
      <input id="rNatId" inputmode="numeric" maxlength="14" placeholder="14 رقم زى ما هو فى البطاقة" dir="ltr" style="text-align:end;letter-spacing:1px"></div>
      <div class="two">
        <div class="fld"><label for="rGov">المحافظة</label><select id="rGov"><option value="">اختار</option></select></div>
        <div class="fld"><label for="rCity">المركز</label><select id="rCity"><option value="">اختار المحافظة الأول</option></select></div>
      </div>
      <div class="fld"><label for="rAddr">العنوان</label><input id="rAddr" placeholder="الشارع والعلامة المميزة"></div>
    </div>

    <div class="fld" id="fpPhoneFld" style="display:none"><label for="fpPhone">رقم الموبايل المسجل بيه</label><input id="fpPhone" type="tel" inputmode="numeric" placeholder="01xxxxxxxxx"></div>
    <div class="fld"><label for="rUser">اسم المستخدم</label><input id="rUser" autocomplete="username" placeholder="بحروف إنجليزى وأرقام" dir="ltr" style="text-align:start"></div>
    <div class="fld"><label for="rPass">الباسورد</label><input id="rPass" type="password" autocomplete="current-password" placeholder="6 خانات على الأقل"></div>

    <button class="btn btn-p" id="authBtn" style="width:100%;margin-top:6px" onclick="submitAuth()">إنشاء الحساب</button>
    <div class="swap" id="authSwap">عندك حساب؟ <b onclick="setMode('login')">سجّل دخول</b></div>
  </div>

  <!-- حسابى -->
  <div class="sheet" id="meSheet">
    <div class="grab"></div>
    <h3>حسابى</h3>
    <p class="lead">بياناتك اللى بنوصل بيها التاجر.</p>
    <div id="meBody"></div>
    <button class="btn btn-g" style="width:100%;margin-top:16px" onclick="logout()">تسجيل الخروج</button>
  </div>

</div>

<script>
const SB   = 'https://oqsowwtjutpjdypjpcum.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xc293d3RqdXRwamR5cGpwY3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MzI5ODAsImV4cCI6MjA5MTAwODk4MH0.Dp-WXuV-fHBsv35xiO7LnkTDevxKE5CC2iEVGNmwnqQ';
const HDR  = { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' };
const FN   = SB + '/functions/v1/sales-chat';
const FX   = SB + '/functions/v1/shop-extras';
let BRAND = null;

let TOKEN = localStorage.getItem('hawa_shop_token') || '';
let ME    = null;
let HIST  = [];
let BUSY  = false;
let AUTH_MODE = 'register';

let GKEY = localStorage.getItem('hawa_shop_guest');
if(!GKEY){
  GKEY = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  localStorage.setItem('hawa_shop_guest', GKEY);
}

const $  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowTime = () => new Date().toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});

// **غامق** → <b>
function fmt(t){
  return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n{3,}/g,'\n\n');
}

function bubble(role, text, at){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'her');
  row.innerHTML = `<div class="bub">${fmt(text)}<div class="tm">${at || nowTime()}</div></div>`;
  $('feed').appendChild(row);
  scroll();
  return row;
}

const CARD_ST = {};
const AR_COLOR_MAP = {'ازرق':'#2E6FD8','كحلي':'#1B2A5B','لبني':'#5BB8E8','تركواز':'#3BB8C4','اسود':'#151515','احمر':'#D83A3A','نبيتي':'#7B1E3B','اخضر':'#2FA75A','زيتي':'#5A6B3B','ابيض':'#F2F2F2','اصفر':'#E8C531','ذهبي':'#C9A84C','دهبي':'#C9A84C','برتقاني':'#E87B2E','برتقالي':'#E87B2E','رمادي':'#9AA0A6','فضي':'#C0C0C0','سيلفر':'#C0C0C0','تيتانيوم':'#8A8D8F','بني':'#7B4A2D','موف':'#8E5AC8','بنفسجي':'#8E5AC8','بينك':'#E56BA6','وردي':'#E56BA6','روز':'#E56BA6'};
function normColor(nm){ return String(nm||'').trim().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه'); }
function colorHex(nm){
  const n = normColor(nm);
  if(AR_COLOR_MAP[n]) return AR_COLOR_MAP[n];
  for(const k in AR_COLOR_MAP){ if(n.length>=3 && (n.startsWith(k)||k.startsWith(n))) return AR_COLOR_MAP[k]; }
  return null;
}
function toggle3d(cid){
  const st = CARD_ST[cid]; const box = document.getElementById(cid);
  const img = document.getElementById(cid+'-img'); const hint = document.getElementById(cid+'-hint');
  const btn = document.getElementById(cid+'-3d');
  if(!st || !box) return;
  if(st.mode !== '3d'){
    if(!st.glb) return;
    let mv = document.getElementById(cid+'-mv');
    if(!mv){
      mv = document.createElement('model-viewer');
      mv.id = cid+'-mv';
      mv.setAttribute('src', st.glb);
      mv.setAttribute('camera-controls','');
      mv.setAttribute('auto-rotate','');
      mv.setAttribute('touch-action','pan-y');
      mv.setAttribute('shadow-intensity','1');
      mv.style.cssText = 'width:100%;aspect-ratio:4/3;background:#0e0e11;display:block';
      box.appendChild(mv);
    }
    mv.style.display='block';
    if(img) img.style.display='none';
    if(hint) hint.style.display='none';
    if(btn) btn.textContent='📷 الصور';
    st.mode='3d';
  } else {
    const mv = document.getElementById(cid+'-mv');
    if(mv) mv.style.display='none';
    if(img) img.style.display='';
    st.mode='photos';
    if(btn) btn.textContent='🧊 شوفها 3D';
    cardShow(cid);
  }
}
function cardShow(cid){
  const st = CARD_ST[cid]; const img = document.getElementById(cid+'-img');
  if(!st || !img || !st.frames.length) return;
  const n = st.frames.length;
  img.src = st.frames[((st.idx % n) + n) % n];
  const hint = document.getElementById(cid+'-hint');
  if(hint) hint.style.display = n>1 ? '' : 'none';
}
function pickColor(cid, ci){
  const st = CARD_ST[cid]; if(!st) return;
  const name = st.colors[ci]; if(name==null) return;
  let fr = null;
  const map = st.map || {};
  for(const k in map){ if(normColor(k)===normColor(name) && Array.isArray(map[k]) && map[k].length){ fr = map[k]; break; } }
  st.frames = (fr || st.all).slice();
  st.idx = 0;
  cardShow(cid);
  document.querySelectorAll(`[data-cid="${cid}"]`).forEach((el,i)=>{
    el.style.outline = i===ci ? '2px solid rgba(255,255,255,.85)' : 'none';
    el.style.outlineOffset = '1px';
  });
}
function initSpin(cid){
  const el = document.getElementById(cid); if(!el) return;
  let sx = null, sIdx = 0;
  el.addEventListener('pointerdown', e=>{ const st=CARD_ST[cid]; if(!st||st.frames.length<2) return; sx=e.clientX; sIdx=st.idx; try{el.setPointerCapture(e.pointerId);}catch(_){} });
  el.addEventListener('pointermove', e=>{ const st=CARD_ST[cid]; if(sx==null||!st) return; const step=Math.round((e.clientX-sx)/38); if(st.idx!==sIdx-step){ st.idx=sIdx-step; cardShow(cid); } });
  const end = ()=>{ sx=null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function bikeCard(c){
  const row = document.createElement('div');
  row.className = 'row her';
  const imgs = Array.isArray(c.images) ? c.images.filter(Boolean) : [];
  const specs = c.specs || {};
  const chips = Object.keys(specs).slice(0,6).map(k=>`<span class="chip">${esc(k)}: ${esc(specs[k])}</span>`).join('');
  const cid = 'bk' + Math.random().toString(36).slice(2,8);
  const colorNames = (c.colors||[]).slice(0,6);
  const colors = colorNames.map((x,i)=>{
    const hx = colorHex(x);
    const bg = hx ? `background:${hx};` : 'background:linear-gradient(135deg,#666,#999);';
    const bd = (!hx || ['#F2F2F2','#151515','#E8C531','#C0C0C0'].includes(hx)) ? 'border:1.5px solid rgba(255,255,255,.4);' : 'border:1.5px solid rgba(255,255,255,.15);';
    return `<span data-cid="${cid}" onclick="pickColor('${cid}',${i})" style="display:inline-flex;align-items:center;gap:5px;margin-inline-end:4px;cursor:pointer;border-radius:20px;padding:2px 4px"><span style="width:15px;height:15px;border-radius:50%;flex-shrink:0;${bg}${bd}box-shadow:0 1px 4px rgba(0,0,0,.5)"></span><span style="font-size:11px;opacity:.75">${esc(x)}</span></span>`;
  }).join('');
  const glb = (typeof c.glb_url==='string' && c.glb_url) ? c.glb_url : '';
  const viewer = (imgs.length||glb) ? `<div id="${cid}" style="position:relative;touch-action:pan-y;user-select:none">
      <img class="card-img" id="${cid}-img" src="${esc(imgs[0]||'')}" alt="" loading="lazy" draggable="false" onerror="this.style.display='none'">
      <div id="${cid}-hint" style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:3px 9px;pointer-events:none;${imgs.length>1?'':'display:none'}">↻ اسحب الصورة تلف 360°</div>
      ${glb?`<button id="${cid}-3d" onclick="toggle3d('${cid}')" style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:4px 11px;cursor:pointer">🧊 شوفها 3D</button>`:''}
    </div>` : '';
  row.innerHTML = `<div class="card">
    ${viewer}
    <div class="card-b">
      <div class="card-nm">${esc(c.name)}</div>
      <div class="card-br">${esc(c.brand||'')}${c.category?' · '+esc(c.category):''}</div>
      <div class="price"><span class="price-l">يبدأ من</span><span class="price-v">${esc(c.price)}</span></div>
      <div class="price-note">${esc(c.price_note||'')}${c.installment?' · '+esc(c.installment):''}${c.min_down?' · مقدم من '+esc(c.min_down):''}</div>
      ${chips||colors ? `<div class="chips" style="align-items:center">${chips}${colors}</div>` : ''}
      <button class="card-cta" onclick="wantIt(${JSON.stringify(String(c.name)).replace(/"/g,'&quot;')})">عايز أشترى دى</button>
    </div></div>`;
  $('feed').appendChild(row);
  CARD_ST[cid] = { all: imgs.slice(), frames: imgs.slice(), idx: 0, colors: colorNames, map: (c.color_images && typeof c.color_images==='object' && !Array.isArray(c.color_images)) ? c.color_images : {}, glb: glb, mode:'photos' };
  initSpin(cid);
  scroll();
}
async function enrichCards(cards){
  const list = Array.isArray(cards) ? cards : [];
  const names = list.map(c=>c && c.name).filter(Boolean);
  if(!names.length) return list;
  try{
    const rows = await rpc('shop_color_images', { p_names: names });
    if(Array.isArray(rows)) for(const r of rows){
      const c = list.find(x=>x && x.name===r.name);
      if(!c) continue;
      c.color_images = r.color_images || {};
      if((!c.images || !c.images.length) && Array.isArray(r.images)) c.images = r.images;
      if((!c.colors || !c.colors.length) && Array.isArray(r.colors)) c.colors = r.colors;
      if(r.glb_url) c.glb_url = r.glb_url;
    }
  }catch(e){}
  return list;
}

}

async function send(){
  const el = $('inp');
  const q = el.value.trim();
  if(!q || BUSY) return;
  el.value = ''; el.style.height = 'auto';
  bubble('user', q);
  HIST.push({ u: q });
  BUSY = true; $('sendBtn').disabled = true; typing(true);
  try{
    const r = await fetch(FN, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, token:TOKEN, guest_key:GKEY, history:HIST.slice(-6) })
    });
    const j = await r.json();
    typing(false);
    if(!j.ok){
      bubble('assistant', j.error === 'no_key'
        ? 'فيه مشكلة مؤقتة فى الخدمة. جرّب تانى بعد شوية.'
        : 'مقدرتش أرد دلوقتى. ابعت سؤالك تانى من فضلك.');
      return;
    }
    bubble('assistant', j.answer);
    HIST.push({ a: j.answer });
    enrichCards(j.cards||[]).then(cs=>cs.forEach(bikeCard));
    if(j.needSignup || j.limit_reached) nudge();
  }catch(e){
    typing(false);
    bubble('assistant', 'النت فصل لحظة. ابعت تانى.');
  }finally{
    BUSY = false; $('sendBtn').disabled = false; el.focus();
  }
}

async function rpc(fn, args){
  const r = await fetch(SB+'/rest/v1/rpc/'+fn, { method:'POST', headers:HDR, body:JSON.stringify(args) });
  const txt = await r.text(); let j=null; try{ j = txt?JSON.parse(txt):null; }catch(e){}
  if(!r.ok) throw new Error((j && (j.message||j.error)) || 'حصل خطأ — حاول تانى');
  return j;
}

let GOVS = {};
async function loadGovs(){
  if(Object.keys(GOVS).length) return;
  try{
    const data = await rpc('get_governorate_cities', {});
    // الدالة بترجع كائن: { "الشرقية": ["أولاد صقر", ...], ... }
    if(data && !Array.isArray(data) && typeof data === 'object'){
      Object.keys(data).forEach(g=>{
        const c = data[g];
        GOVS[g] = Array.isArray(c) ? c.slice() : (c ? [c] : []);
      });
    } else if(Array.isArray(data)){
      data.forEach(r=>{
        const g = r.governorate || r.gov || r.name;
        const c = r.city || r.cities;
        if(!g) return;
        if(!GOVS[g]) GOVS[g] = [];
        if(Array.isArray(c)) GOVS[g].push(...c); else if(c) GOVS[g].push(c);
      });
    }
  }catch(e){}
  if(!Object.keys(GOVS).length){
    // الشبكة فصلت — خلى الخانتين كتابة حرة بدل ما يقف
    const g = document.getElementById('rGov'), c = document.getElementById('rCity');
    if(g && g.tagName === 'SELECT'){
      g.outerHTML = '<input id="rGov" placeholder="اكتب المحافظة">';
      c.outerHTML = '<input id="rCity" placeholder="اكتب المركز">';
    }
    return;
  }
  const sel = $('rGov');
  if(sel && sel.tagName === 'SELECT'){
    sel.innerHTML = '<option value="">اختار</option>' +
      Object.keys(GOVS).sort((a,b)=>a.localeCompare(b,'ar')).map(g=>`<option>${esc(g)}</option>`).join('');
  }
}
document.addEventListener('change', function(e){
  if(!e.target || e.target.id !== 'rGov') return;
  const city = $('rCity');
  if(!city || city.tagName !== 'SELECT') return;
  const list = [...new Set(GOVS[e.target.value] || [])].sort((a,b)=>a.localeCompare(b,'ar'));
  city.innerHTML = list.length
    ? '<option value="">اختار</option>' + list.map(c=>`<option>${esc(c)}</option>`).join('')
    : '<option value="">اكتب المركز فى العنوان</option>';
});

async function submitAuth(){
  const btn = $('authBtn'); btn.disabled = true;
  const old = btn.textContent; btn.textContent = 'ثانية...';
  try{
    const user = ($('rUser').value||'').trim();
    const pass = ($('rPass').value||'');
    let res;
    if(AUTH_MODE === 'forgot'){
      const fPhone = ($('fpPhone').value||'').trim();
      if(!user || !fPhone || pass.length < 4){ authErr('اكتب اسم المستخدم ورقم الموبايل وكلمة سر جديدة (4 خانات على الأقل)'); return; }
      await rpc('consumer_forgot_password', { p_user: user, p_phone: fPhone, p_new_pass: pass });
      authOk('اتغيرت كلمة السر ✅ سجّل دخول بيها دلوقتى');
      $('rPass').value = '';
      setTimeout(()=>setMode('login'), 1200);
      return;
    }
    if(AUTH_MODE === 'register'){
      const natId = ($('rNatId')?.value||'').replace(/[^0-9٠-٩]/g,'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      if(natId.length !== 14){ authErr('الرقم القومى لازم يكون 14 رقم زى ما هو فى البطاقة'); return; }
      res = await rpc('consumer_register', { p_data: {
        national_id: natId,
        name: ($('rName').value||'').trim(), phone: ($('rPhone').value||'').trim(),
        username: user, password: pass,
        governorate: ($('rGov')||{}).value || '', city: ($('rCity')||{}).value || '',
        address: ($('rAddr').value||'').trim()
      }});
    } else {
      res = await rpc('consumer_login', { p_user: user, p_pass: pass });
    }
    if(!res || !res.token) throw new Error('حصل خطأ — حاول تانى');
    TOKEN = res.token;
    localStorage.setItem('hawa_shop_token', TOKEN);
    authOk('تمام! حسابك جاهز ✅');
    await loadMe();
    setTimeout(()=>{ closeSheet(); document.querySelectorAll('.nudge').forEach(n=>n.remove());
      $('clipBtn').style.display='flex';
      bubble('assistant','تمام يا '+ME.name.split(' ')[0]+'! دلوقتى قولى الموديل اللى عايزه وأنا أوصّل طلبك لتجار منطقتك على طول 🏍️');
    }, 700);
  }catch(e){
    authErr(e.message || 'حصل خطأ — حاول تانى');
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

// ═══ الرسائل الصوتية ═══
let REC = null, CHUNKS = [], RECT = null, RECSEC = 0;
async function toggleRec(){
  if(REC && REC.state === 'recording'){ stopRec(true); return; }
  if(BUSY) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    CHUNKS = []; RECSEC = 0;
    REC = new MediaRecorder(stream);
    REC.ondataavailable = e => { if(e.data.size) CHUNKS.push(e.data); };
    REC.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(CHUNKS, { type: 'audio/webm' });
      if(REC._send && blob.size > 800) await sendVoice(blob);
    };
    REC.start();
    $('micBtn').classList.add('rec'); $('micBtn').textContent = '✓';
    $('recBar').classList.add('on'); $('inp').style.display = 'none';
    RECT = setInterval(()=>{
      RECSEC++;
      $('recTime').textContent = Math.floor(RECSEC/60) + ':' + String(RECSEC%60).padStart(2,'0');
      if(RECSEC >= 60) stopRec(true);
    }, 1000);
  }catch(e){
    bubble('assistant','مقدرتش أفتح الميكروفون — اسمحلى بالإذن من إعدادات المتصفح وجرّب تانى.');
  }
}
function stopRec(send){
  if(!REC) return;
  REC._send = !!send;
  try{ REC.stop(); }catch(e){}
  clearInterval(RECT);
  $('micBtn').classList.remove('rec'); $('micBtn').textContent = '🎤';
  $('recBar').classList.remove('on'); $('inp').style.display = '';
  $('recTime').textContent = '0:00';
}
async function sendVoice(blob){
  BUSY = true; $('sendBtn').disabled = true; $('micBtn').disabled = true;
  const localUrl = URL.createObjectURL(blob);
  voiceBubble('user', '', localUrl);
  typing(true);
  try{
    const b64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=> res(String(r.result).split(',')[1] || '');
      r.onerror = ()=> rej(new Error('read'));
      r.readAsDataURL(blob);
    });
    const r = await fetch(FX, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'voice', audio_b64:b64, ext:'webm', token:TOKEN, guest_key:GKEY, history:HIST.slice(-6) }) });
    const j = await r.json();
    typing(false);
    if(!j.ok){ bubble('assistant', j.error || 'مسمعتش الكلام كويس — جرّب تانى.'); return; }
    if(j.question) HIST.push({ u: j.question });
    if(j.audio) voiceBubble('assistant', j.answer, 'data:' + (j.mime||'audio/mpeg') + ';base64,' + j.audio);
    else bubble('assistant', j.answer);
    HIST.push({ a: j.answer });
    enrichCards(j.cards||[]).then(cs=>cs.forEach(bikeCard));
    if(j.needSignup) nudge();
  }catch(e){
    typing(false);
    bubble('assistant','حصلت مشكلة فى الرسالة الصوتية — جرّب تانى.');
  }finally{
    BUSY = false; $('sendBtn').disabled = false; $('micBtn').disabled = false;
  }
}

async function uploadId(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  if(!ME){ bubble('assistant','عشان أستقبل صورة بطاقتك لازم تسجّل دخول الأول 🙏'); return; }
  if(f.size > 6 * 1024 * 1024){ bubble('assistant','الصورة كبيرة شوية — ابعت واحدة أصغر من 6 ميجا.'); return; }
  const clip = $('clipBtn'); clip.classList.add('busy');
  bubble('user','📎 ' + f.name);
  typing(true);
  try{
    const b64 = await new Promise((res, rej)=>{
      const r = new FileReader();
      r.onload = ()=> res(String(r.result).split(',')[1] || '');
      r.onerror = ()=> rej(new Error('read'));
      r.readAsDataURL(f);
    });
    const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
    const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'upload_id', token:TOKEN, file_b64:b64, ext }) });
    const j = await r.json();
    typing(false);
    bubble('assistant', j.ok
      ? 'وصلتنى صورة البطاقة ✅ تمام كده، الجواب بيتجهز وهنطمنك أول بأول 🤝'
      : (j.error || 'مقدرتش أستقبل الصورة — جرّب تانى.'));
  }catch(e){
    typing(false);
    bubble('assistant','حصلت مشكلة فى رفع الصورة — جرّب تانى.');
  }finally{ clip.classList.remove('busy'); }
}

// ═══ البداية ═══
async function boot(){
  try{
    const r = await fetch(FX, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'brand' }) });
    BRAND = await r.json();
  }catch(e){ BRAND = null; }
  if(BRAND && BRAND.ok){
    document.title = BRAND.brand;
    $('hdName').textContent = BRAND.brand;
    $('hdSub').textContent = BRAND.tagline;
    if(BRAND.logo) $('ava').innerHTML = `<img src="${esc(BRAND.logo)}" alt="">`;
    if(BRAND.voice_on) $('micBtn').style.display = 'flex';
  }
  await loadMe();
  let msgs = [];
  try{
    const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'history', token:TOKEN, guest_key:GKEY }) });
    const j = await r.json();
    msgs = (j && j.messages) || [];
  }catch(e){}

  if(msgs.length){
    msgs.slice(-40).forEach(m=>{
      bubble(m.role, m.content, new Date(m.created_at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}));
      HIST.push(m.role==='user' ? {u:m.content} : {a:m.content});
    });
  } else {
    const bn = (BRAND && BRAND.brand) || 'أبو حوا';
    const ag = (BRAND && BRAND.agent) || 'سالى';
    bubble('assistant', (BRAND && BRAND.welcome) ||
      ('أهلاً بيك فى **' + bn + '** 🏍️\nأنا ' + ag + ' — اسألنى عن أى موتوسيكل وأقولك المواصفات والسعر، ولو عجبك أوصّلك بأقرب تاجر معتمد فى منطقتك.\n\nعايز تعرف إيه؟'));
  }
  $('inp').focus();
}
boot();
</script>
